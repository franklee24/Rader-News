<!-- radar-ui-v3 -->
<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0f18"><meta name="description" content="雷达新闻：全球新闻事件雷达"><link rel="manifest" href="manifest.webmanifest"><title>雷达新闻 · GLOBAL RADAR</title>
<style>
:root{--bg:#070b12;--panel:#0d131d;--line:#223044;--text:#edf3fb;--muted:#8e9bad;--accent:#4da3ff;--hot:#ffb454}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 20% -10%,#17263a 0,#070b12 35%);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}header{position:sticky;top:0;z-index:10;background:rgba(7,11,18,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.top{max-width:1450px;margin:auto;padding:11px 18px;display:flex;align-items:center;gap:14px}.brand{font-weight:800;font-size:20px;letter-spacing:.5px}.brand span{color:var(--accent)}.status{margin-left:auto;color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:7px 11px;border-radius:8px;cursor:pointer}.btn:hover{border-color:#3c5573}.nav{max-width:1450px;margin:auto;padding:0 18px 9px;display:flex;gap:7px;overflow:auto}.nav button{white-space:nowrap}
main{max-width:1450px;margin:12px auto;padding:0 18px}.hero{display:grid;grid-template-columns:1.45fr 1fr;gap:10px;margin-bottom:10px}.card{background:linear-gradient(180deg,rgba(17,26,38,.96),rgba(10,16,25,.96));border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 8px 28px #0003}.kicker{font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:1.3px}.headline{font-size:23px;font-weight:800;margin:4px 0}.sub{color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{background:#0a1019;border:1px solid var(--line);border-radius:9px;padding:9px}.stat b{display:block;font-size:20px}.stat span{color:var(--muted);font-size:10px}.section{display:none}.section.active{display:block}.sectionTitle{display:flex;align-items:end;justify-content:space-between;margin:12px 0 7px;scroll-margin-top:105px}.sectionTitle h2{margin:0;font-size:17px}.sectionTitle span{color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.event{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px;cursor:pointer;transition:.15s}.event:hover{transform:translateY(-1px);border-color:#365275}.meta{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:10px;margin-bottom:6px}.badge{border:1px solid #2d4865;border-radius:99px;padding:2px 6px;color:#a9d3ff}.score{margin-left:auto;color:var(--hot);font-weight:700}.event h3{font-size:14px;line-height:1.4;margin:0 0 7px}.event p{margin:0;color:var(--muted);font-size:11px}.top10{grid-template-columns:repeat(2,minmax(0,1fr));counter-reset:toprank}.top10 .event{position:relative;padding-left:42px}.top10 .event:before{counter-increment:toprank;content:counter(toprank);position:absolute;left:13px;top:13px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#162438;border:1px solid #315173;color:#9fcaff;font-weight:800;font-size:11px}.top10 .event:first-child:before{background:#4b3516;color:#ffd27a;border-color:#8b6628}.countryGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.country{padding:9px 11px;background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:.15s}.country:hover{border-color:#365275;transform:translateY(-1px)}.country b{font-size:14px}.country small{display:block;color:var(--muted);margin-top:2px;font-size:10px}.country strong{float:right;color:var(--accent);font-size:14px}.country.selected{border-color:var(--accent);box-shadow:0 0 0 1px #4da3ff33}.search{width:280px;max-width:55vw;background:#0a1019;border:1px solid var(--line);color:var(--text);padding:8px 11px;border-radius:8px}#modal{display:none;position:fixed;inset:0;background:#000b;z-index:30;padding:24px;overflow:auto}.modalbox{max-width:900px;margin:24px auto;background:#0d131d;border:1px solid var(--line);border-radius:14px;padding:18px}.modalbox h2{font-size:21px}.close{float:right}.source{border-top:1px solid var(--line);padding:9px 0}.source a{color:#8ec8ff;text-decoration:none}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
@media(max-width:900px){.hero{grid-template-columns:1fr}.grid,.top10{grid-template-columns:1fr}.countryGrid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.headline{font-size:21px}}
</style></head><body>
<header><div class="top"><div class="brand">雷达新闻 <span>GLOBAL RADAR</span></div><input id="search" class="search" placeholder="搜索新闻事件…"><div id="status" class="status">正在加载…</div><button class="btn" onclick="loadData(true)">↻ 刷新</button></div><div class="nav" id="nav"><button class="btn" onclick="show('top')">GLOBAL TOP</button><button class="btn" onclick="show('tier1')">第一梯队</button><button class="btn" onclick="show('tier2')">第二梯队</button><button class="btn" onclick="show('tier3')">第三梯队</button><button class="btn" onclick="show('tier4')">第四梯队</button><button class="btn" onclick="show('supplement')">全球补充</button></div></header>
<main><div class="hero"><div class="card"><div class="kicker">Daily Intelligence Brief</div><div class="headline">全球重要新闻 · 24H 雷达</div><div class="sub" id="updated">数据加载中…</div></div><div class="card"><div class="stats"><div class="stat"><b id="s1">—</b><span>Tier 1 事件</span></div><div class="stat"><b id="s2">—</b><span>全部国家事件</span></div><div class="stat"><b id="s3">10</b><span>全球 TOP</span></div><div class="stat"><b id="s4">—</b><span>失败源</span></div></div></div></div>
<section id="top" class="section active"><div class="sectionTitle"><h2>GLOBAL TOP</h2><span>当天全部事件按重要性评分排序 · TOP 10</span></div><div id="topgrid" class="grid top10"></div></section>
<section id="tier1" class="section"><div class="sectionTitle"><h2>第一梯队</h2><span>美国 · 中国 · 英国 · 法国 · 德国 · 俄罗斯 · 日本</span></div><div id="tier1countries" class="countryGrid"></div><div id="tier1events"></div></section>
<section id="tier2" class="section"><div class="sectionTitle"><h2>第二梯队</h2></div><div id="tier2countries" class="countryGrid"></div><div id="tier2events"></div></section>
<section id="tier3" class="section"><div class="sectionTitle"><h2>第三梯队</h2></div><div id="tier3countries" class="countryGrid"></div><div id="tier3events"></div></section>
<section id="tier4" class="section"><div class="sectionTitle"><h2>第四梯队</h2></div><div id="tier4countries" class="countryGrid"></div><div id="tier4events"></div></section>
<section id="supplement" class="section"><div class="sectionTitle"><h2>全球补充</h2><span>其他国家、地区与国际组织</span></div><div id="supgrid" class="grid"></div></section></main>
<div id="modal"><div class="modalbox"><button class="btn close" onclick="closeModal()">关闭</button><div id="modalbody"></div></div></div>
<script>
let DATA=null,all=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function card(e){return `<article class="event" onclick='openEvent(${JSON.stringify(e).replace(/'/g,"&#39;")})'><div class="meta"><span class="badge">${esc(e.event_country||'全球')}</span><span>${esc(e.category||'')}</span><span class="score">${e.importance||0}</span></div><h3>${esc(e.title)}</h3><p>${esc(e.source_names?.join(' · ')||e.source||'')}</p></article>`}
function buildAll(){all=[];Object.values(DATA?.tiers||{}).forEach(t=>Object.values(t).forEach(c=>all.push(...(c.events||[]))));all.push(...(DATA?.supplement||[]));return all}
function getGlobalTop(){return [...all].sort((a,b)=>(Number(b.importance)||0)-(Number(a.importance)||0)).slice(0,10)}
function render(){if(!DATA)return;buildAll();document.getElementById('updated').textContent=`更新于 ${DATA.generated_beijing||''} · 统计窗口 ${DATA.window_hours||24} 小时 · ${DATA.stale_fallback?'备用快照':'实时采集快照'}`;let st=DATA.stats||{};['s1','s2','s3','s4'].forEach((id,i)=>document.getElementById(id).textContent=[st.tier1_events||0,all.length,Math.min(10,all.length),st.failed_sources||0][i]);document.getElementById('topgrid').innerHTML=getGlobalTop().map(card).join('')||'<div class="empty">暂无数据</div>';['tier1','tier2','tier3','tier4'].forEach(t=>{let box=document.getElementById(t+'countries'),evbox=document.getElementById(t+'events'),entries=Object.values(DATA.tiers?.[t]||{});box.innerHTML=entries.map(x=>`<div id="tab-${t}-${esc(x.code||x.country)}" class="country" onclick="selectCountry('${t}','${esc(x.code||x.country)}')"><b>${esc(x.country)}</b><strong>${x.count}</strong><small>${x.target_min?`目标 ${x.target_min}-${x.target_max} · `:''}${x.count<x.target_min?'本轮不足，宁缺毋滥':'已达到目标'}</small></div>`).join('');evbox.innerHTML=entries.map(x=>`<div id="country-${t}-${esc(x.code||x.country)}" class="sectionTitle"><h2>${esc(x.country)}</h2><span>${x.count} 条</span></div><div class="grid">${x.events.map(card).join('')||'<div class="empty">24h 内无足够高价值独立事件</div>'}</div>`).join('')});document.getElementById('supgrid').innerHTML=(DATA.supplement||[]).map(card).join('')||'<div class="empty">暂无补充事件</div>'}
function show(id){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}
function selectCountry(t,code){show(t);document.querySelectorAll('.country').forEach(x=>x.classList.remove('selected'));document.getElementById(`tab-${t}-${code}`)?.classList.add('selected');setTimeout(()=>document.getElementById(`country-${t}-${code}`)?.scrollIntoView({behavior:'smooth',block:'start'}),80);}
function findEvent(id){return all.find(e=>e.id===id)}
function openEvent(e){let sources=(e.sources||[]).map(s=>`<div class="source"><b>${esc(s.source||'来源')}</b><br><a target="_blank" rel="noopener" href="${esc(s.link)}">打开报道</a></div>`).join('');document.getElementById('modalbody').innerHTML=`<div class="kicker">${esc(e.event_country||'全球')} · ${esc(e.category||'')}</div><h2>${esc(e.title)}</h2><p><b>重要性：</b>${e.importance||0}　<b>国内性：</b>${e.domestic_score||0}</p><p><b>为什么重要：</b>${esc(e.why_important)}</p><p><b>影响：</b>${esc(e.impact)}</p><p><b>未来72小时：</b>${esc(e.next_72h)}</p><h3>相关来源</h3>${sources||'<p class="sub">暂无多源记录</p>'}`;document.getElementById('modal').style.display='block'}function closeModal(){document.getElementById('modal').style.display='none'}
async function loadData(force=false){try{let r=await fetch('data/daily.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);DATA=await r.json();render();document.getElementById('status').textContent=DATA.stale_fallback?'备用快照':'LIVE';}catch(e){document.getElementById('status').textContent='数据读取失败';}}
document.getElementById('search').addEventListener('input',e=>{let q=e.target.value.trim().toLowerCase();if(!q){render();return}let found=all.filter(x=>(x.title+' '+x.event_country+' '+x.category).toLowerCase().includes(q));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.getElementById('top').classList.add('active');document.getElementById('topgrid').innerHTML=found.slice(0,100).map(card).join('')||'<div class="empty">没有匹配事件</div>'});loadData();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
