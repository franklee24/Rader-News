<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06101c"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest"><title>雷达新闻｜全球新闻情报</title>
<style>
:root{--bg:#06101c;--p:#0b1827;--line:#20384f;--text:#e9f2fa;--muted:#8ca3b8;--blue:#43b9ff;--green:#35d19b;--yellow:#ffc65a}
*{box-sizing:border-box}body{margin:0;background:#040a11;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.top{position:sticky;top:0;z-index:10;background:#06101ceb;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:13px 16px}.brand{display:flex;align-items:center;gap:10px}.logo{width:39px;height:39px;border-radius:12px;background:linear-gradient(145deg,#45c4ff,#2768ff);display:grid;place-items:center}.ring{width:24px;height:24px;border:2px solid #fff;border-radius:50%}h1{font-size:20px;margin:0}.brand small{color:var(--muted);font-size:10px}.status{margin-left:auto;color:var(--muted);font-size:10px;text-align:right}.status b{color:var(--green)}.nav,.chips,.tabs{display:flex;gap:7px;overflow:auto;margin-top:12px}.nav button,.chip,.tab{border:1px solid var(--line);background:#091725;color:#a9bfd2;border-radius:999px;padding:7px 12px;white-space:nowrap}.active{color:#fff!important;background:#123753!important;border-color:#2b739c!important}.main{max-width:1280px;margin:auto;padding:14px}.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}.card{background:linear-gradient(180deg,#0c1a2a,#091522);border:1px solid var(--line);border-radius:15px;padding:14px}.hero h2{font-size:25px;margin:5px 0}.muted{color:var(--muted);line-height:1.65}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.metric{background:#081421;border:1px solid var(--line);border-radius:10px;padding:9px}.metric b{font-size:20px;display:block}.metric span{font-size:10px;color:var(--muted)}.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.tier{cursor:pointer}.tier small{display:block;color:var(--muted);margin-top:5px}.progress{height:4px;background:#13283b;border-radius:9px;margin-top:8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#267cff,#48d1ff);border-radius:9px}.toolbar{display:flex;gap:8px;margin:15px 0 9px;flex-wrap:wrap}.search{flex:1;min-width:220px;border:1px solid var(--line);background:#07131f;color:#fff;border-radius:999px;padding:10px 14px}.section{display:flex;justify-content:space-between;margin:15px 2px 9px}.section h3{margin:0}.section span{color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.event{cursor:pointer}.event h4{font-size:14px;line-height:1.5;margin:9px 0}.badge{font-size:10px;color:#68c7ff;background:#102e45;padding:3px 6px;border-radius:5px}.score{float:right;color:var(--yellow);font-weight:700}.meta{font-size:10px;color:var(--muted);display:flex;gap:9px;flex-wrap:wrap}.empty{text-align:center;color:var(--muted);padding:30px}.error{color:#ff9baa;border-color:#6e2c38}.drawer{display:none;position:fixed;inset:0;background:#0009;z-index:30}.drawer.show{display:block}.detail{position:absolute;right:0;top:0;width:min(680px,95%);height:100%;overflow:auto;background:#081421;padding:20px}.source{display:block;color:#62c6ff;border:1px solid var(--line);border-radius:9px;padding:9px;margin:7px 0;text-decoration:none}.close{float:right;background:none;border:0;color:#9fb2c5;font-size:28px}@media(max-width:760px){.hero{grid-template-columns:1fr}.tiers{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header class="top"><div class="brand"><div class="logo"><div class="ring"></div></div><div><h1>雷达新闻</h1><small>GLOBAL RADAR · LIVE DAILY</small></div><div class="status">DAILY SNAPSHOT<br><b id="updated">加载中</b></div></div><nav class="nav" id="nav"></nav></header>
<main class="main"><section class="hero"><div class="card"><span class="badge" id="badge">读取日报</span><h2>全球重要新闻雷达</h2><p class="muted">以独立新闻事件为最小单位；同一事件的多家报道合并。覆盖各国国内政治、经济、金融、产业、科技、能源、国防、外交、社会与灾害。</p></div><div class="card"><div class="metrics"><div class="metric"><b id="total">0</b><span>独立事件</span></div><div class="metric"><b id="countries">0</b><span>覆盖国家</span></div><div class="metric"><b id="sources">0</b><span>来源数</span></div><div class="metric"><b>10</b><span>Global TOP</span></div></div><p class="muted" style="font-size:11px" id="quality">等待数据……</p></div></section>
<div class="section"><h3>国家梯队</h3><span>目标：独立事件 / 国</span></div><section class="tiers" id="tiers"></section>
<div class="toolbar"><input class="search" id="search" placeholder="搜索国家、事件、来源、分类……"><div class="chips" id="cats"></div></div><div class="tabs" id="tabs"></div>
<div class="section"><h3 id="title">Global TOP</h3><span id="count"></span></div><section class="grid" id="events"></section></main>
<div class="drawer" id="drawer"><article class="detail"><button class="close" onclick="closeDetail()">×</button><div id="detail"></div></article></div>
<script>
const tiers={"Tier 1":{target:"20–30",countries:["美国","中国","英国","法国","德国","俄罗斯","日本"]},"Tier 2":{target:"≤20",countries:["印度","巴西","沙特阿拉伯","韩国","加拿大","澳大利亚"]},"Tier 3":{target:"≤15",countries:["乌克兰","意大利","印度尼西亚","土耳其","阿联酋","墨西哥","伊朗","瑞士"]},"Tier 4":{target:"≤10",countries:["新加坡","南非","荷兰","以色列","西班牙","埃及","尼日利亚","阿根廷","波兰","越南"]}};
const cats=["全部","政治","经济","金融","产业","科技","能源","国防","外交","社会","灾害"];let data=[],snap=null,tier="全部",country="全部",cat="全部";const $=x=>document.getElementById(x);
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function tierOf(c){for(const[t,v]of Object.entries(tiers))if(v.countries.includes(c))return t;return"全球补充"}
function renderNav(){$("nav").innerHTML=["Global TOP","Tier 1","Tier 2","Tier 3","Tier 4","全球补充"].map(x=>`<button class="${(x==="Global TOP"&&tier==="全部")||x===tier?"active":""}" onclick="setTier('${x}')">${x}</button>`).join("")}
function setTier(x){tier=x==="Global TOP"?"全部":x;country="全部";render()}
function renderTiers(){$("tiers").innerHTML=Object.entries(tiers).map(([t,v])=>{let n=data.filter(e=>tierOf(e.event_country)===t).length,target=t==="Tier 1"?30:t==="Tier 2"?20:t==="Tier 3"?15:10;return`<div class="card tier" onclick="setTier('${t}')"><b>${t}</b><small>${v.countries.length} 个国家 · ${v.target} / 国 · 当前 ${n} 条</small><div class="progress"><i style="width:${Math.min(100,n/(v.countries.length*target)*100)}%"></i></div></div>`}).join("")}
function renderCats(){$("cats").innerHTML=cats.map(x=>`<button class="chip ${cat===x?"active":""}" onclick="setCat('${x}')">${x}</button>`).join("")}function setCat(x){cat=x;render()}
function renderTabs(){let cs=tier==="全部"?Object.values(tiers).flatMap(x=>x.countries):tiers[tier]?.countries||[];$("tabs").innerHTML=["全部",...cs].map(x=>`<button class="tab ${country===x?"active":""}" onclick="setCountry('${x}')">${x}</button>`).join("")}function setCountry(x){country=x;render()}
function filtered(){let q=$("search").value.trim().toLowerCase();return data.filter(e=>(tier==="全部"||tierOf(e.event_country)===tier)&&(country==="全部"||e.event_country===country)&&(cat==="全部"||e.category===cat)&&(!q||[e.title,e.event_country,e.category,e.source_names].join(" ").toLowerCase().includes(q)))}
function card(e){return`<article class="card event" onclick="openDetail('${e.id}')"><span class="badge">${esc(tierOf(e.event_country))} · ${esc(e.event_country)} · ${esc(e.category)}</span><span class="score">${Number(e.importance||0).toFixed(0)}</span><h4>${esc(e.title)}</h4><div class="meta"><span>${esc(e.published_at||"")}</span><span>${(e.sources||[]).length} 个来源</span><span>国内重要度 ${Number(e.domestic_score||0).toFixed(0)}</span></div></article>`}
function render(){renderNav();renderTiers();renderCats();renderTabs();let arr=filtered();$("title").textContent=country!=="全部"?`Global TOP · ${country}`:tier==="全部"?"Global TOP":tier;$("count").textContent=`${arr.length} 个独立事件`;$("events").innerHTML=arr.length?arr.map(card).join(""):`<div class="card empty ${snap?.quality?.errors?.length?"error":""}" style="grid-column:1/-1">${esc(snap?.quality?.summary||"当前条件没有独立事件。")}</div>`}
function openDetail(id){let e=data.find(x=>x.id===id);if(!e)return;$("detail").innerHTML=`<span class="badge">${esc(tierOf(e.event_country))} · ${esc(e.event_country)} · ${esc(e.category)} · ${Number(e.importance||0).toFixed(0)}</span><h2>${esc(e.title)}</h2><h3>为什么重要</h3><p class="muted">${esc(e.why_important)}</p><h3>潜在影响</h3><p class="muted">${esc(e.impact)}</p><h3>未来72小时</h3><p class="muted">${esc(e.next_72h)}</p><h3>原始来源</h3>${(e.sources||[]).map(s=>`<a class="source" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)} ↗</a>`).join("")}`;$("drawer").classList.add("show")}function closeDetail(){$("drawer").classList.remove("show")}
async function load(){try{let r=await fetch("./data/daily.json?ts="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);snap=await r.json();data=Array.isArray(snap.events)?snap.events:[];$("updated").textContent=snap.updated_at||"已更新";$("badge").textContent="LIVE DAILY · "+(snap.report_date||"");$("quality").textContent=snap.quality?.summary||"数据已加载";$("total").textContent=data.length;$("countries").textContent=new Set(data.map(e=>e.event_country)).size;$("sources").textContent=new Set(data.flatMap(e=>(e.sources||[]).map(s=>s.name))).size;render()}catch(e){snap={quality:{summary:"新闻数据读取失败："+e.message+"。"}};data=[];$("badge").textContent="DATA ERROR";$("quality").textContent=snap.quality.summary;render()}}
$("search").addEventListener("input",render);load();
</script></body></html>
