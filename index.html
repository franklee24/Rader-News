const NAV_ITEMS=[{id:'top',title:'GLOBAL TOP',sub:'全球重要事件'},{id:'tier1',title:'TIER 1',sub:'核心国家'},{id:'tier2',title:'TIER 2',sub:'重要国家'},{id:'tier3',title:'TIER 3',sub:'重点观察'},{id:'tier4',title:'TIER 4',sub:'全球补充'}];let flipIndex=0;let flipTouchY=0;
function show(id){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.getElementById('searchResults').innerHTML='';let ni=NAV_ITEMS.findIndex(x=>x.id===id);if(ni>=0){flipIndex=ni;renderFlipNav()}window.scrollTo({top:0,behavior:'smooth'})}
function renderFlipNav(){let stack=document.getElementById('flipStack');if(!stack)return;stack.innerHTML=NAV_ITEMS.map((n,i)=>{let d=i-flipIndex,ad=Math.abs(d);let cls=d===0?'is-current':ad===1?'is-near':'is-far';let y=d*76;let scale=d===0?1:d===1||d===-1?.9:.82;let rot=d*2.5;let opacity=ad>2?0:ad===2?.34:ad===1?.62:1;return '<button class="flip-card '+cls+'" style="transform:translateY('+y+'px) scale('+scale+') rotateX('+rot+'deg);opacity:'+opacity+';" onclick="setFlipIndex('+i+',true)"><div class="flip-no">'+(i+1).toString().padStart(2,'0')+'</div><div class="flip-title">'+n.title+'</div><div class="flip-sub">'+n.sub+'</div></button>'}).join('');document.getElementById('flipDots').innerHTML=NAV_ITEMS.map((n,i)=>'<span class="flip-dot '+(i===flipIndex?'active':'')+'"></span>').join('')}
function setFlipIndex(i,navigate=true){flipIndex=(i+NAV_ITEMS.length)%NAV_ITEMS.length;renderFlipNav();if(navigate){radarNavigate(NAV_ITEMS[flipIndex].id);setTimeout(collapseFlipNav,180)}}
function flipPrev(){setFlipIndex(flipIndex-1,true)}function flipNext(){setFlipIndex(flipIndex+1,true)}
function collapseFlipNav(){document.getElementById('flipNav').classList.add('collapsed');document.getElementById('flipReopen').classList.add('show')}
function openFlipNav(){document.getElementById('flipNav').classList.remove('collapsed');document.getElementById('flipReopen').classList.remove('show');renderFlipNav()}
function setNavMode(mode){localStorage.setItem('radar-nav-mode',mode);document.getElementById('navRadar').classList.toggle('active',mode==='radar');document.getElementById('navFlip').classList.toggle('active',mode==='flip');document.getElementById('radarUI').style.display=mode==='radar'?'block':'none';document.getElementById('flipNav').classList.toggle('show',mode==='flip');if(mode==='flip'){openFlipNav();closeRadar()}else{document.getElementById('flipNav').classList.remove('collapsed');document.getElementById('flipReopen').classList.remove('show')}}
function initNavMode(){setNavMode(localStorage.getItem('radar-nav-mode')||'radar')}
function globalTop(){return [...all].sort((a,b)=>(Number(b.importance)||0)-(Number(a.importance)||0)||String(b.published_at||'').localeCompare(String(a.published_at||''))).slice(0,10)}
function render(){if(!DATA)return;buildAll();let st=DATA.stats||{};document.getElementById('updated').textContent=`更新于 ${DATA.generated_beijing||''} · 统计窗口 ${DATA.window_hours||24} 小时 · ${DATA.stale_fallback?'备用快照':'实时采集快照'}`;document.getElementById('s1').textContent=st.tier1_events??0;document.getElementById('s2').textContent=all.length;document.getElementById('s3').textContent=Math.min(10,all.length);document.getElementById('s4').textContent=st.failed_sources??0;document.getElementById('topgrid').innerHTML=globalTop().map((e,i)=>card(e,i+1)).join('')||'<div class="empty topfix">暂无可排序事件</div>';['tier1','tier2','tier3','tier4'].forEach(t=>{let box=document.getElementById(t+'countries'),evbox=document.getElementById(t+'events'),entries=Object.values(DATA.tiers?.[t]||{});box.innerHTML=entries.map(x=>`<div id="tab-${t}-${esc(x.code||x.country)}" class="country" onclick="selectCountry('${t}','${esc(x.code||x.country)}')"><b>${esc(x.country)}</b><strong>${x.count??(x.events||[]).length}</strong><small>${x.target_min?`目标 ${x.target_min}-${x.target_max} · `:''}${x.target_min&&x.count<x.target_min?'本轮不足，宁缺毋滥':'已达到目标'}</small></div>`).join('');evbox.innerHTML=entries.map(x=>`<div id="country-${t}-${esc(x.code||x.country)}" class="sectionTitle"><h2>${esc(x.country)}</h2><span>${x.count??(x.events||[]).length} 条</span></div><div class="grid">${(x.events||[]).map(card).join('')||'<div class="empty topfix">24h 内无足够高价值独立事件</div>'}</div>`).join('')});document.getElementById('supgrid').innerHTML=(DATA.supplement||[]).map(card).join('')||'<div class="empty topfix">暂无补充事件</div>'}
function selectCountry(t,code){show(t);document.querySelectorAll('.country').forEach(x=>x.classList.remove('selected'));document.getElementById(`tab-${t}-${code}`)?.classList.add('selected');setTimeout(()=>document.getElementById(`country-${t}-${code}`)?.scrollIntoView({behavior:'smooth',block:'start'}),100)}function radarNavigate(id){show(id);closeRadar();setTimeout(()=>document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'}),100)}function toggleRadar(){let u=document.getElementById('radarUI'),o=u.classList.toggle('open');document.getElementById('radarLauncher').setAttribute('aria-expanded',String(o))}function closeRadar(){document.getElementById('radarUI').classList.remove('open');document.getElementById('radarLauncher').setAttribute('aria-expanded','false')}document.getElementById('radarLauncher').onclick=toggleRadar;document.getElementById('flipNav').addEventListener('wheel',e=>{if(Math.abs(e.deltaY)<10)return;e.preventDefault();e.deltaY>0?flipNext():flipPrev()},{passive:false});document.getElementById('flipNav').addEventListener('touchstart',e=>{document.getElementById('flipNav').classList.add('touching');flipTouchY=e.touches[0].clientY},{passive:true});document.getElementById('flipNav').addEventListener('touchend',e=>{document.getElementById('flipNav').classList.remove('touching');let dy=flipTouchY-e.changedTouches[0].clientY;if(Math.abs(dy)>35)dy>0?flipNext():flipPrev()},{passive:true});initNavMode();document.addEventListener('click',e=>{let u=document.getElementById('radarUI');if(u.classList.contains('open')&&!u.contains(e.target))closeRadar()});document.addEventListener('keydown',e=>e.key==='Escape'&&closeRadar());
function openEvent(e){let sources=(e.sources||[]).map(s=>`<div class="source"><b>${esc(s.source||'来源')}</b><br><a target="_blank" rel="noopener" href="${esc(s.link||s.url||'#')}">打开报道</a></div>`).join('');let zh=e.title_zh?.trim()||'',raw=e.title?.trim()||'';let title=raw||zh||'未命名事件';let original=zh&&raw&&zh!==raw?`<div class="original-title"><b>译文：</b>${esc(zh)}</div>`:'';document.getElementById('modalbody').innerHTML=`<div class="kicker">${esc(e.event_country||'全球')} · ${esc(e.category||'')}</div><h2>${esc(title)}</h2>${original}<p><b>重要性：</b>${Number(e.importance)||0}　<b>等级：</b>${esc(e.importance_level||'')}</p><p><b>为什么重要：</b>${esc(e.why_important||'')}</p><p><b>影响：</b>${esc(e.impact||'')}</p><p><b>未来72小时：</b>${esc(e.next_72h||'')}</p><h3>相关来源</h3>${sources||'<p class="sub">暂无多源记录</p>'}`;document.getElementById('modal').style.display='block'}function closeModal(){document.getElementById('modal').style.display='none'}
function doSearch(q){q=q.trim().toLowerCase();let box=document.getElementById('searchResults');if(!q){box.innerHTML='';return}document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));let hits=all.filter(e=>(`${e.title_zh||''} ${e.title||''} ${e.description||''} ${e.event_country||''} ${e.category||''}`).toLowerCase().includes(q)).slice(0,30);box.innerHTML=`<div class="sectionTitle"><h2>搜索结果</h2><span>${hits.length} 条</span></div><div class="grid">${hits.map(card).join('')||'<div class="empty topfix">没有匹配事件</div>'}</div>`}document.getElementById('search').addEventListener('input',e=>doSearch(e.target.value));
function applyTheme(theme){let day=theme==='day'||(theme==='auto'&&new Date().getHours()>=7&&new Date().getHours()<19);document.body.classList.toggle('day',day);['Auto','Day','Night'].forEach(x=>document.getElementById('theme'+x)?.classList.toggle('active',theme===x.toLowerCase()));document.querySelector('meta[name="theme-color"]').setAttribute('content',day?'#edf8f2':'#070b12')}
let themeTimer=null;function scheduleAutoTheme(){if(themeTimer)clearTimeout(themeTimer);if(localStorage.getItem('radar-theme')!=='auto')return;let now=new Date(),next=new Date(now);next.setHours(now.getHours()<7?7:19,0,0,0);if(next<=now)next.setDate(next.getDate()+1);themeTimer=setTimeout(()=>{applyTheme('auto');scheduleAutoTheme()},next-now)}function setTheme(theme){localStorage.setItem('radar-theme',theme);applyTheme(theme);scheduleAutoTheme()}let savedTheme=localStorage.getItem('radar-theme')||'auto';applyTheme(savedTheme);scheduleAutoTheme();
async function loadData(){try{let r=await fetch('data/daily.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);DATA=await r.json();render();document.getElementById('status').textContent=DATA.stale_fallback?'备用快照':'LIVE'}catch(e){document.getElementById('status').textContent='加载失败';console.error(e)}}loadData();
</script></body></html>
