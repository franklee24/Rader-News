<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06101c">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<title>雷达新闻｜全球新闻情报</title>
<style>
:root{--bg:#06101c;--p:#0b1827;--p2:#0e2032;--line:#20384f;--text:#e9f2fa;--muted:#8ca3b8;--blue:#43b9ff;--green:#35d19b;--yellow:#ffc65a;--red:#ff6378}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#12304a 0,#07111e 35%,#040a11 100%);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;transition:background .35s,color .25s}
button,input{font:inherit}.app{min-height:100vh}.top{position:sticky;top:0;z-index:10;background:#06101ceb;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:13px 18px;transition:background .35s,border-color .25s}.brand{display:flex;align-items:center;gap:11px}.logo{width:39px;height:39px;border-radius:12px;background:linear-gradient(145deg,#45c4ff,#2768ff);display:grid;place-items:center;box-shadow:0 0 24px #2888ff55}.ring{width:24px;height:24px;border:2px solid #fff;border-radius:50%;position:relative}.ring:after{content:"";position:absolute;left:50%;top:50%;width:10px;height:2px;background:#fff;transform-origin:left;transform:rotate(-35deg)}h1{font-size:20px;margin:0}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1px;margin-top:2px}.status{margin-left:auto;text-align:right;color:var(--muted);font-size:10px}.status b{color:var(--green)}
.nav{display:flex;gap:7px;overflow:auto;margin-top:12px}.nav button,.chip{border:1px solid var(--line);background:#091725;color:#a9bfd2;border-radius:999px;padding:7px 12px;white-space:nowrap}.nav button.active,.chip.active{color:#fff;background:#123753;border-color:#2b739c}
.main{width:min(1280px,100%);margin:auto;padding:16px}.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:12px}.card{background:linear-gradient(180deg,#0c1a2a,#091522);border:1px solid var(--line);border-radius:15px;padding:15px;transition:background .35s,border-color .25s,box-shadow .35s}.hero h2{font-size:27px;margin:5px 0 7px}.muted{color:var(--muted);line-height:1.65}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.metric{background:#081421;border:1px solid var(--line);border-radius:11px;padding:10px}.metric b{font-size:20px;display:block}.metric span{font-size:10px;color:var(--muted)}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.tier{cursor:pointer}.tier b{font-size:14px}.tier small{color:var(--muted);display:block;margin-top:4px}.progress{height:4px;background:#13283b;border-radius:9px;margin-top:8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#267cff,#48d1ff);border-radius:9px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 10px}.search{flex:1;min-width:220px;border:1px solid var(--line);background:#07131f;color:#fff;border-radius:999px;padding:10px 14px;outline:none;transition:background .35s,color .25s,border-color .25s}.cats{display:flex;gap:6px;overflow:auto}.section{display:flex;align-items:center;justify-content:space-between;margin:17px 2px 9px}.section h3{margin:0;font-size:17px}.section span{font-size:11px;color:var(--muted)}.countryTabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.countryTabs button{border:1px solid var(--line);background:#091624;color:#9db2c6;border-radius:8px;padding:7px 10px;white-space:nowrap}.countryTabs button.active{background:#123752;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.event{cursor:pointer;transition:.16s}.event:hover{transform:translateY(-2px);border-color:#35647f}.event .badge{display:inline-block;font-size:10px;color:#68c7ff;background:#102e45;padding:3px 6px;border-radius:5px}.event .score{float:right;color:var(--yellow);font-weight:700;font-size:12px}.event h4{font-size:14px;line-height:1.5;margin:9px 0 7px}.meta{font-size:10px;color:var(--muted);display:flex;gap:9px;flex-wrap:wrap}.empty{padding:30px;text-align:center;color:var(--muted)}.error{border-color:#6e2c38;color:#ff9baa}.drawer{display:none;position:fixed;inset:0;background:#0009;z-index:30}.drawer.show{display:block}.detail{position:absolute;right:0;top:0;width:min(680px,95%);height:100%;overflow:auto;background:#081421;border-left:1px solid var(--line);padding:20px}.close{float:right;border:0;background:none;color:#9fb2c5;font-size:28px}.source{display:block;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;color:#62c6ff;text-decoration:none}.source:hover{background:#10263a}.footer{text-align:center;color:#5f758b;font-size:10px;padding:28px}.badge{font-size:10px;color:var(--green);border:1px solid #235c4a;padding:3px 6px;border-radius:5px}.quality{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* 主题选择器 */
.theme-picker{margin-left:8px;display:flex;gap:4px;align-items:center}.theme-picker button{border:1px solid var(--line);background:#091725;color:#a9bfd2;border-radius:999px;padding:6px 9px;font-size:11px;cursor:pointer}.theme-picker button.active{color:#fff;background:#123753;border-color:#2b739c}.theme-label{font-size:10px;color:var(--muted);white-space:nowrap}
/* 白天：浅绿色情报台风格；夜间保持原有深色雷达视觉 */
body.day{--bg:#eef8f2;--p:#ffffff;--p2:#f5fbf7;--line:#c8dfd2;--text:#17332a;--muted:#668076;--blue:#278b68;--green:#15976b;--yellow:#b77900;--red:#c94758;background:radial-gradient(circle at 15% 0,#d8f1e2 0,#edf8f1 38%,#f8fcf9 100%)}
body.day .top{background:rgba(246,252,248,.93)}body.day .logo{background:linear-gradient(145deg,#49bd8c,#218a68);box-shadow:0 0 24px #36a87835}body.day .nav button,body.day .chip{background:#f4faf6;color:#527267}body.day .nav button.active,body.day .chip.active{color:#174d3a;background:#dff2e7;border-color:#80bda1}body.day .card{background:linear-gradient(180deg,#ffffff,#f4faf7);box-shadow:0 4px 18px rgba(44,105,77,.06)}body.day .metric{background:#f7fbf8}body.day .search{background:#fff;color:var(--text)}body.day .countryTabs button{background:#f5faf7;color:#557269}body.day .countryTabs button.active{background:#dff1e7;color:#174d3a}body.day .event .badge{color:#237b5d;background:#e1f3e9}body.day .progress{background:#d9ebe1}body.day .progress i{background:linear-gradient(90deg,#2b9c75,#58c69b)}body.day .detail{background:#f8fcf9}body.day .theme-picker button{background:#f5faf7;color:#527267}body.day .theme-picker button.active{color:#174d3a;background:#dff2e7;border-color:#80bda1}
@media(max-width:760px){.hero{grid-template-columns:1fr}.tiers{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.main{padding:11px}.hero h2{font-size:23px}.status{display:none}.theme-picker{margin-left:0}.theme-label{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div class="brand"><div class="logo"><div class="ring"></div></div><div><h1>雷达新闻</h1><small>GLOBAL RADAR · LIVE DAILY</small></div><div class="status">DAILY SNAPSHOT<br><b id="updated">加载中</b></div></div>
<nav class="nav" id="nav"></nav>
<div class="theme-picker" aria-label="主题选择"><span class="theme-label">主题</span><button id="themeAuto" onclick="setTheme('auto')">自动</button><button id="themeDay" onclick="setTheme('day')">☀ 白天</button><button id="themeNight" onclick="setTheme('night')">☾ 夜间</button></div>
</header>
<main class="main">
<section class="hero">
<div class="card"><span class="badge" id="dataBadge">正在读取日报</span><h2>全球重要新闻雷达</h2><p class="muted">以“独立新闻事件”为最小单位；同一事件的多家报道合并，保留多个原始来源。重点覆盖各国国内政治、经济、金融、产业、科技、能源、国防、外交、社会与灾害。</p><div class="quality"><span class="badge">24H</span><span class="badge">跨语言去重</span><span class="badge">多来源验证</span><span class="badge">宁缺毋滥</span></div></div>
<div class="card"><div class="metrics"><div class="metric"><b id="total">0</b><span>独立事件</span></div><div class="metric"><b id="countries">0</b><span>覆盖国家</span></div><div class="metric"><b id="sources">0</b><span>来源数</span></div><div class="metric"><b>10</b><span>Global TOP</span></div></div><p class="muted" style="font-size:11px;margin-bottom:0" id="qualityText">等待数据……</p></div>
</section>
<div class="section"><h3>国家梯队</h3><span>目标数量：独立事件 / 国</span></div><section class="tiers" id="tiers"></section>
<div class="toolbar"><input class="search" id="search" placeholder="搜索国家、事件、来源、分类……"><div class="cats" id="cats"></div></div>
<div class="countryTabs" id="countryTabs"></div>
<div class="section"><h3 id="title">Global TOP</h3><span id="count"></span></div><section class="grid" id="events"></section>
<div class="footer">雷达新闻 · GDELT / 其他授权来源 · 原始来源优先 · 页面数据自动读取 daily.json</div>
</main></div>
<div class="drawer" id="drawer"><article class="detail"><button class="close" onclick="closeDetail()">×</button><div id="detail"></div></article></div>
<script>
const tiers={
"Tier 1":{target:"20–30",countries:["美国","中国","英国","法国","德国","俄罗斯","日本"]},
"Tier 2":{target:"≤20",countries:["印度","巴西","沙特阿拉伯","韩国","加拿大","澳大利亚"]},
"Tier 3":{target:"≤15",countries:["乌克兰","意大利","印度尼西亚","土耳其","阿联酋","墨西哥","伊朗","瑞士"]},
"Tier 4":{target:"≤10",countries:["新加坡","南非","荷兰","以色列","西班牙","埃及","尼日利亚","阿根廷","波兰","越南"]}};
const cats=["全部","政治","经济","金融","产业","科技","能源","国防","外交","社会","灾害"];
let data=[], snapshot=null, tierFilter="全部", countryFilter="全部", catFilter="全部";
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function tierOf(c){for(const [t,v] of Object.entries(tiers))if(v.countries.includes(c))return t;return "补充";}
function navRender(){ $("nav").innerHTML=["Global TOP","Tier 1","Tier 2","Tier 3","Tier 4","全球补充"].map(x=>`<button class="${(x==="Global TOP"&&tierFilter==="全部")||(x===tierFilter)?"active":""}" onclick="setTier('${x}')">${x}</button>`).join("");}
function setTier(x){tierFilter=x==="Global TOP"?"全部":x;countryFilter="全部";render();}
function renderTiers(){ $("tiers").innerHTML=Object.entries(tiers).map(([t,v])=>{let n=data.filter(e=>tierOf(e.event_country)===t).length;let countries=new Set(data.filter(e=>tierOf(e.event_country)===t).map(e=>e.event_country)).size;let target=t==="Tier 1"?30:t==="Tier 2"?20:t==="Tier 3"?15:10;return `<div class="card tier" onclick="setTier('${t}')"><b>${t}</b><small>${v.countries.length} 个国家 · ${v.target} / 国 · 当前 ${n} 条</small><div class="progress"><i style="width:${Math.min(100,n/(v.countries.length*target)*100)}%"></i></div></div>`}).join("");}
function renderCats(){ $("cats").innerHTML=cats.map(c=>`<button class="chip ${catFilter===c?"active":""}" onclick="setCat('${c}')">${c}</button>`).join("");}
function setCat(c){catFilter=c;render();}
function renderCountries(){let cs=tierFilter==="全部"?Object.values(tiers).flatMap(x=>x.countries):tiers[tierFilter]?.countries||[]; $("countryTabs").innerHTML=["全部",...cs].map(c=>`<button class="${countryFilter===c?"active":""}" onclick="setCountry('${c}')">${c}</button>`).join("");}
function setCountry(c){countryFilter=c;render();}
function filtered(){let q=$("search").value.trim().toLowerCase();return data.filter(e=>(tierFilter==="全部"||tierOf(e.event_country)===tierFilter)&&(countryFilter==="全部"||e.event_country===countryFilter)&&(catFilter==="全部"||e.category===catFilter)&&(!q||[e.title,e.event_country,e.category,e.source_names,(e.sources||[]).map(s=>s.name).join(" ")].join(" ").toLowerCase().includes(q)));}
function card(e,i){return `<article class="card event" onclick="openDetail('${e.id}')"><span class="badge">${esc(tierOf(e.event_country))} · ${esc(e.event_country)} · ${esc(e.category)}</span><span class="score">${Number(e.importance||0).toFixed(0)}</span><h4>${esc(e.title)}</h4><div class="meta"><span>${esc(e.published_at||"")}</span><span>${(e.sources||[]).length} 个来源</span><span>国内重要度 ${Number(e.domestic_score||0).toFixed(0)}</span></div></article>`;}
function render(){navRender();renderTiers();renderCats();renderCountries();let arr=filtered();$("title").textContent=countryFilter!=="全部"?`Global TOP · ${countryFilter}`:tierFilter==="全部"?"Global TOP":tierFilter;$("count").textContent=`${arr.length} 个独立事件`;$("events").innerHTML=arr.length?arr.map(card).join(""):`<div class="card empty ${snapshot?.error?"error":""}" style="grid-column:1/-1">${esc(snapshot?.error||"当前条件没有达到质量门槛的独立事件。")}</div>`;}
function openDetail(id){let e=data.find(x=>x.id===id);if(!e)return;$("detail").innerHTML=`<span class="badge">${esc(tierOf(e.event_country))} · ${esc(e.event_country)} · ${esc(e.category)} · 重要性 ${Number(e.importance||0).toFixed(0)}</span><h2>${esc(e.title)}</h2><h3>为什么重要</h3><p class="muted">${esc(e.why_important||"暂无")}</p><h3>潜在影响</h3><p class="muted">${esc(e.impact||"暂无")}</p><h3>未来72小时</h3><p class="muted">${esc(e.next_72h||"暂无")}</p><h3>多来源</h3>${(e.sources||[]).map(s=>`<a class="source" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name||s.domain||"原始来源")} ↗</a>`).join("")}`;$("drawer").classList.add("show");}
function closeDetail(){$("drawer").classList.remove("show")}
async function load(){try{const r=await fetch("./data/daily.json?ts="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);snapshot=await r.json();data=Array.isArray(snapshot.events)?snapshot.events:[];$("updated").textContent=snapshot.updated_at||"已更新";$("dataBadge").textContent="LIVE DAILY · "+(snapshot.report_date||"");$("qualityText").textContent=snapshot.quality?.summary||"数据已加载";$("total").textContent=data.length;$("countries").textContent=new Set(data.map(e=>e.event_country)).size;$("sources").textContent=new Set(data.flatMap(e=>(e.sources||[]).map(s=>s.name))).size;render();}catch(err){snapshot={error:"新闻数据读取失败："+err.message+"。请检查 GitHub Actions 是否已成功运行。"};data=[];$("dataBadge").textContent="DATA ERROR";$("qualityText").textContent="未能读取 data/daily.json";render();}}
function applyTheme(theme){let actual=theme;if(theme==="auto"){const h=new Date().getHours();actual=(h>=7&&h<19)?"day":"night";}document.body.classList.toggle("day",actual==="day");["Auto","Day","Night"].forEach(x=>$("theme"+x).classList.toggle("active",theme===x.toLowerCase()));document.querySelector('meta[name="theme-color"]').setAttribute("content",actual==="day"?"#eef8f2":"#06101c");}
function setTheme(theme){localStorage.setItem("radar-theme",theme);applyTheme(theme);}
(function(){const saved=localStorage.getItem("radar-theme")||"auto";applyTheme(saved);if(saved==="auto")setInterval(()=>applyTheme("auto"),60000);})();
$("search").addEventListener("input",render);load();
</script>
</body></html>
