<div id="flipNav" class="flip-nav" aria-label="翻页式全球导航"><div class="flip-hint">上下滑动预览 · 点击进入</div><div id="flipViewport" class="flip-viewport"><div id="flipTrack" class="flip-track"></div></div><div id="flipIndexLine" class="flip-index-line">PREVIEW · 不会自动跳转</div><div id="flipDots" class="flip-dots"></div></div><button id="flipReopen" class="flip-reopen" onclick="openFlipNav()" aria-label="重新打开翻页导航"><span class="flip-icon"><i></i><i></i><i></i></span><span class="flip-label">翻页导航</span></button><script>
let DATA=null,all=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function normalizeEvents(){let out=[];Object.values(DATA?.tiers||{}).forEach(t=>Object.values(t||{}).forEach(c=>out.push(...(c?.events||[]))));if(Array.isArray(DATA?.supplement))out.push(...DATA.supplement);if(!out.length&&Array.isArray(DATA?.events))out=DATA.events;return out}function buildAll(){all=normalizeEvents()}
function displayTitle(e){return e?.title||e?.title_zh||'未命名事件'}
function card(e,rank){let score=Number(e.importance)||0,level=e.importance_level||'';let zh=e.title_zh?.trim()||'',raw=e.title?.trim()||'';let title=raw||zh||'未命名事件';let original=zh&&raw&&zh!==raw?`<div class="original-title"><b>译文：</b>${esc(zh)}</div>`:'';return `<article class="event" ${rank?`data-rank="${rank}"`:''} onclick='openEvent(${JSON.stringify(e).replace(/'/g,"&#39;")})'><div class="meta"><span class="badge">${esc(e.event_country||'全球')}</span><span>${esc(e.category||'')}</span><span class="score">${score}</span></div><h3>${esc(title)}</h3>${original}<p>${esc((e.source_names||[]).join(' · ')||e.source||'')}</p><div class="importance">${level?`<span class="level ${score>=80?'hot':''}">${esc(level)}</span>`:''}</div></article>`}
const NAV_ITEMS=[{id:'top',title:'GLOBAL TOP',sub:'全球重要事件'},{id:'tier1',title:'TIER 1',sub:'核心国家'},{id:'tier2',title:'TIER 2',sub:'重要国家'},{id:'tier3',title:'TIER 3',sub:'重点观察'},{id:'tier4',title:'TIER 4',sub:'全球补充'}];
let flipIndex=0,flipPos=0,flipVelocity=0,flipFrame=0,flipDragging=false,flipPointerId=null,flipLastY=0,flipLastTime=0,flipSuppressClick=false,flipWasDragged=false;

function show(id){
  document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
  document.getElementById(id)?.classList.add('active');

  const ni=NAV_ITEMS.findIndex(x=>x.id===id);
  if(ni>=0){flipIndex=ni;flipPos=ni;renderFlipPosition(ni);}
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderFlipNav(){
  const track=document.getElementById('flipTrack');if(!track)return;
  const step=148,center=156;
  track.style.height=(NAV_ITEMS.length*step+220)+'px';
  track.innerHTML=NAV_ITEMS.map((n,i)=>'<button class="flip-card" data-flip-index="'+i+'" aria-label="'+esc(n.title)+'"><div class="flip-no">'+String(i+1).padStart(2,'0')+' / '+NAV_ITEMS.length+'</div><div class="flip-title">'+n.title+'</div><div class="flip-sub">'+n.sub+'</div></button>').join('');
  document.getElementById('flipDots').innerHTML=NAV_ITEMS.map((n,i)=>'<span class="flip-dot '+(i===Math.round(flipPos)?'active':'')+'"></span>').join('');
  document.getElementById('flipIndexLine').textContent='PREVIEW · '+String(Math.round(flipPos)+1).padStart(2,'0')+' / '+NAV_ITEMS.length+' · 点击卡片进入';
    renderFlipPosition(flipPos);
}

function renderFlipPosition(p){
  flipPos=Math.max(0,Math.min(NAV_ITEMS.length-1,p));
  const track=document.getElementById('flipTrack');if(!track)return;
  const step=148,center=156;
  track.style.transform='translate3d(0,'+(center-flipPos*step)+'px,0)';
  track.querySelectorAll('.flip-card').forEach((card,i)=>{
    const d=Math.abs(i-flipPos),delta=i-flipPos;
    card.style.top=(i*step)+'px';
    card.style.transform='translate3d(0,0,0) scale('+(d<.5?1:d<1.5?.91:d<2.5?.78:.68)+')';
    card.style.opacity=d>2.35?'0':d>1.55?.34:d>1.05?.68:1;
    card.style.zIndex=String(100-Math.round(d*10));
    card.classList.toggle('is-current',d<.5);
    card.classList.toggle('is-near',d<1.1);
    card.classList.toggle('is-far',d>1.5);
  });
  document.querySelectorAll('#flipDots .flip-dot').forEach((d,i)=>d.classList.toggle('active',i===Math.round(flipPos)));
  const line=document.getElementById('flipIndexLine');if(line)line.textContent='PREVIEW · '+String(Math.round(flipPos)+1).padStart(2,'0')+' / '+NAV_ITEMS.length+' · 点击卡片进入';
}

function clampFlipPos(p){return Math.max(0,Math.min(NAV_ITEMS.length-1,p))}
function animateFlipTo(target){
  target=clampFlipPos(target);cancelAnimationFrame(flipFrame);
  const from=flipPos,dist=target-from,duration=Math.min(700,180+Math.abs(dist)*105),t0=performance.now();
  function step(now){const t=Math.min(1,(now-t0)/duration),e=1-Math.pow(1-t,4);renderFlipPosition(from+dist*e);if(t<1)flipFrame=requestAnimationFrame(step);else{flipPos=target;renderFlipPosition(target)}}
  flipFrame=requestAnimationFrame(step);
}

let flipHideTimer=0;

function resetFlipHideTimer(){
  clearTimeout(flipHideTimer);
  const el=document.getElementById('flipNav');
  if(!el || !el.classList.contains('show') || el.classList.contains('collapsed'))return;
  flipHideTimer=setTimeout(()=>collapseFlipNav(),5000);
}

function commitFlipSelection(index){
  index=clampFlipPos(index);
  flipIndex=index;
  flipPos=index;
  renderFlipPosition(index);
  radarNavigate(NAV_ITEMS[index].id);
  clearTimeout(flipHideTimer);
  setTimeout(collapseFlipNav,120);
}

function snapFlip(){
  cancelAnimationFrame(flipFrame);
  const projected=clampFlipPos(flipPos+flipVelocity*.18);
  const target=clampFlipPos(Math.round(projected));
  flipVelocity=0;
  animateFlipTo(target);
}

function beginFlipDrag(y){
  cancelAnimationFrame(flipFrame);
  clearTimeout(flipHideTimer);
  flipDragging=true;
  flipWasDragged=false;
  flipSuppressClick=false;
  flipLastY=y;
  flipLastTime=performance.now();
  flipVelocity=0;
  document.getElementById('flipNav').classList.add('is-dragging');
}

function dragFlipTo(y){
  if(!flipDragging)return;
  const now=performance.now(),dy=flipLastY-y,dt=Math.max(8,now-flipLastTime);
  if(Math.abs(y-flipLastY)>3)flipWasDragged=true;
  renderFlipPosition(flipPos+dy/105);
  flipVelocity=Math.max(-3,Math.min(3,(dy/dt)*.018));
  flipLastY=y;
  flipLastTime=now;
}

function finishFlipDrag(){
  if(!flipDragging)return;
  flipDragging=false;
  document.getElementById('flipNav').classList.remove('is-dragging');
  const glide=()=>{
    flipVelocity*=.91;
    if(Math.abs(flipVelocity)<.035){
      flipVelocity=0;
      snapFlip();
      resetFlipHideTimer();
      return;
    }
    renderFlipPosition(flipPos+flipVelocity*.018);
    flipFrame=requestAnimationFrame(glide);
  };
  flipFrame=requestAnimationFrame(glide);
}

function flipPrev(){animateFlipTo(clampFlipPos(Math.round(flipPos)-1));resetFlipHideTimer()}
function flipNext(){animateFlipTo(clampFlipPos(Math.round(flipPos)+1));resetFlipHideTimer()}

function collapseFlipNav(){
  clearTimeout(flipHideTimer);
  const el=document.getElementById('flipNav');
  el.classList.remove('dismissed');
  requestAnimationFrame(()=>el.classList.add('collapsed'));
  document.getElementById('flipReopen').classList.add('show');
  setTimeout(()=>el.classList.add('dismissed'),620);
}

function openFlipNav(){
  clearTimeout(flipHideTimer);
  const el=document.getElementById('flipNav');
  el.classList.remove('dismissed','collapsed');
  document.getElementById('flipReopen').classList.remove('show');
  flipDragging=false;
  flipVelocity=0;
  renderFlipNav();
  resetFlipHideTimer();
}

function setNavMode(mode){
  localStorage.setItem('radar-nav-mode',mode);
  document.getElementById('navRadar').classList.toggle('active',mode==='radar');
  document.getElementById('navFlip').classList.toggle('active',mode==='flip');
  document.getElementById('radarUI').style.display=mode==='radar'?'block':'none';
  document.getElementById('flipNav').classList.toggle('show',mode==='flip');
  if(mode==='flip'){openFlipNav();closeRadar()}
  else{document.getElementById('flipNav').classList.remove('collapsed');document.getElementById('flipReopen').classList.remove('show')}
}
function initNavMode(){setNavMode(localStorage.getItem('radar-nav-mode')||'radar')}

function globalTop(){return [...all].sort((a,b)=>(Number(b.importance)||0)-(Number(a.importance)||0)||String(b.published_at||'').localeCompare(String(a.published_at||''))).slice(0,10)}
function render(){if(!DATA)return;buildAll();let st=DATA.stats||{};document.getElementById('updated').textContent=`更新于 ${DATA.generated_beijing||''} · 统计窗口 ${DATA.window_hours||24} 小时 · ${DATA.stale_fallback?'备用快照':'实时采集快照'}`;document.getElementById('s1').textContent=st.tier1_events??0;document.getElementById('s2').textContent=all.length;document.getElementById('s3').textContent=Math.min(10,all.length);document.getElementById('s4').textContent=st.failed_sources??0;document.getElementById('topgrid').innerHTML=globalTop().map((e,i)=>card(e,i+1)).join('')||'<div class="empty topfix">暂无可排序事件</div>';['tier1','tier2','tier3','tier4'].forEach(t=>{let box=document.getElementById(t+'countries'),evbox=document.getElementById(t+'events'),entries=Object.values(DATA.tiers?.[t]||{});box.innerHTML=entries.map(x=>`<div id="tab-${t}-${esc(x.code||x.country)}" class="country" onclick="selectCountry('${t}','${esc(x.code||x.country)}')"><b>${esc(x.country)}</b><strong>${x.count??(x.events||[]).length}</strong><small>${x.target_min?`目标 ${x.target_min}-${x.target_max} · `:''}${x.target_min&&x.count<x.target_min?'本轮不足，宁缺毋滥':'已达到目标'}</small></div>`).join('');evbox.innerHTML=entries.map(x=>`<div id="country-${t}-${esc(x.code||x.country)}" class="sectionTitle"><h2>${esc(x.country)}</h2><span>${x.count??(x.events||[]).length} 条</span></div><div class="grid">${(x.events||[]).map(card).join('')||'<div class="empty topfix">24h 内无足够高价值独立事件</div>'}</div>`).join('')});document.getElementById('supgrid').innerHTML=(DATA.supplement||[]).map(card).join('')||'<div class="empty topfix">暂无补充事件</div>'}
function selectCountry(t,code){show(t);document.querySelectorAll('.country').forEach(x=>x.classList.remove('selected'));document.getElementById(`tab-${t}-${code}`)?.classList.add('selected');setTimeout(()=>document.getElementById(`country-${t}-${code}`)?.scrollIntoView({behavior:'smooth',block:'start'}),100)}function radarNavigate(id){show(id);closeRadar();setTimeout(()=>document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'}),100)}function toggleRadar(){let u=document.getElementById('radarUI'),o=u.classList.toggle('open');document.getElementById('radarLauncher').setAttribute('aria-expanded',String(o))}function closeRadar(){document.getElementById('radarUI').classList.remove('open');document.getElementById('radarLauncher').setAttribute('aria-expanded','false')}document.getElementById('radarLauncher').onclick=toggleRadar;
const flipEl=document.getElementById('flipNav'),flipViewport=document.getElementById('flipViewport');

function stopDragEvent(e){e.preventDefault();e.stopPropagation()}

flipViewport.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  const card=e.target.closest?.('.flip-card');
  if(card){
    // 卡片点击保留原生 click；这里只记录起点，不阻断点击。
    flipPointerId=e.pointerId;
    flipViewport.setPointerCapture?.(e.pointerId);
    beginFlipDrag(e.clientY);
    return;
  }
  stopDragEvent(e);
  flipPointerId=e.pointerId;
  flipViewport.setPointerCapture?.(e.pointerId);
  beginFlipDrag(e.clientY);
},{passive:false,capture:true});

flipViewport.addEventListener('pointermove',e=>{
  if(flipPointerId!==e.pointerId)return;
  const card=e.target.closest?.('.flip-card');
  if(Math.abs(e.clientY-flipLastY)>4){
    e.preventDefault();
    e.stopPropagation();
  }
  dragFlipTo(e.clientY);
},{passive:false,capture:true});

flipViewport.addEventListener('pointerup',e=>{
  if(flipPointerId!==e.pointerId)return;
  const dragged=flipWasDragged;
  if(dragged){e.preventDefault();e.stopPropagation()}
  flipViewport.releasePointerCapture?.(e.pointerId);
  flipPointerId=null;
  finishFlipDrag();
},{passive:false,capture:true});

flipViewport.addEventListener('pointercancel',e=>{
  if(flipPointerId!==e.pointerId)return;
  e.preventDefault();
  e.stopPropagation();
  flipViewport.releasePointerCapture?.(e.pointerId);
  flipPointerId=null;
  finishFlipDrag();
},{passive:false,capture:true});

flipViewport.addEventListener('click',e=>{
  const card=e.target.closest?.('.flip-card');
  if(!card)return;
  e.stopPropagation();
  if(flipWasDragged){
    flipWasDragged=false;
    return;
  }
  const i=Number(card.dataset.flipIndex);
  if(Number.isInteger(i))commitFlipSelection(i);
},true);

flipViewport.addEventListener('mouseenter',()=>{
  clearTimeout(flipHideTimer);
  resetFlipHideTimer();
});
flipViewport.addEventListener('mouseleave',()=>{
  // 离开后不强制关闭；重新进入仍可继续操作。
});
flipViewport.addEventListener('wheel',e=>{
  stopDragEvent(e);
  renderFlipPosition(flipPos+Math.max(-2.8,Math.min(2.8,e.deltaY/160)));
  clearTimeout(window.__flipWheel);
  window.__flipWheel=setTimeout(()=>{snapFlip();resetFlipHideTimer()},80);
},{passive:false,capture:true});

document.addEventListener('touchmove',e=>{
  if(flipDragging)e.preventDefault();
},{passive:false,capture:true});

function openEvent(e){let sources=(e.sources||[]).map(s=>`<div class="source"><b>${esc(s.source||'来源')}</b><br><a target="_blank" rel="noopener" href="${esc(s.link||s.url||'#')}">打开报道</a></div>`).join('');let zh=e.title_zh?.trim()||'',raw=e.title?.trim()||'';let title=raw||zh||'未命名事件';let original=zh&&raw&&zh!==raw?`<div class="original-title"><b>译文：</b>${esc(zh)}</div>`:'';document.getElementById('modalbody').innerHTML=`<div class="kicker">${esc(e.event_country||'全球')} · ${esc(e.category||'')}</div><h2>${esc(title)}</h2>${original}<p><b>重要性：</b>${Number(e.importance)||0}　<b>等级：</b>${esc(e.importance_level||'')}</p><p><b>为什么重要：</b>${esc(e.why_important||'')}</p><p><b>影响：</b>${esc(e.impact||'')}</p><p><b>未来72小时：</b>${esc(e.next_72h||'')}</p><h3>相关来源</h3>${sources||'<p class="sub">暂无多源记录</p>'}`;document.getElementById('modal').style.display='block'}function closeModal(){document.getElementById('modal').style.display='none'}
function applyTheme(theme){let day=theme==='day'||(theme==='auto'&&new Date().getHours()>=7&&new Date().getHours()<19);document.body.classList.toggle('day',day);['Auto','Day','Night'].forEach(x=>document.getElementById('theme'+x)?.classList.toggle('active',theme===x.toLowerCase()));document.querySelector('meta[name="theme-color"]').setAttribute('content',day?'#edf8f2':'#070b12')}
let themeTimer=null;function scheduleAutoTheme(){if(themeTimer)clearTimeout(themeTimer);if(localStorage.getItem('radar-theme')!=='auto')return;let now=new Date(),next=new Date(now);next.setHours(now.getHours()<7?7:19,0,0,0);if(next<=now)next.setDate(next.getDate()+1);themeTimer=setTimeout(()=>{applyTheme('auto');scheduleAutoTheme()},next-now)}function setTheme(theme){localStorage.setItem('radar-theme',theme);applyTheme(theme);scheduleAutoTheme()}let savedTheme=localStorage.getItem('radar-theme')||'auto';applyTheme(savedTheme);scheduleAutoTheme();
async function loadData(){try{let r=await fetch('data/daily.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);DATA=await r.json();render();document.getElementById('status').textContent=DATA.stale_fallback?'备用快照':'LIVE'}catch(e){document.getElementById('status').textContent='加载失败';console.error(e)}}loadData();
</script></body></html>
