name: Expand Daily News Coverage

on:
  push:
    branches: [main]
    paths:
      - 'scripts/coverage_expand.py'
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-coverage-expand
  cancel-in-progress: true

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Expand country coverage
        run: python scripts/coverage_expand.py
      - name: Translate English titles only
        run: python scripts/translate_titles.py
      - name: Validate title translations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/daily.json').read_text(encoding='utf-8'))
          events=[]
          for tier in d.get('tiers',{}).values():
              for country in tier.values():
                  events.extend(country.get('events',[]))
          events.extend(d.get('supplement',[]))
          english=[e for e in events if isinstance(e.get('title'),str) and e['title'].strip() and not any('\u3400' <= ch <= '\u9fff' for ch in e['title'])]
          translated=[e for e in english if e.get('title_zh')]
          print('English titles:',len(english),'translated:',len(translated))
          if english and not translated:
              raise SystemExit('TITLE TRANSLATION GATE FAILED: no English titles were translated')
          if translated < max(1, int(len(english)*0.5)):
              raise SystemExit(f'TITLE TRANSLATION GATE FAILED: only {len(translated)}/{len(english)} translated')
          PY
      - name: Commit expanded snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json data/history/
          git diff --cached --quiet || git commit -m "data: expand country news coverage"
          git push
