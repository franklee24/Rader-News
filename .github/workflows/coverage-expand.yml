name: Expand Daily News Coverage

on:
  push:
    branches: [main]
    paths:
      - 'scripts/coverage_expand.py'
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-coverage-expand
  cancel-in-progress: true

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Expand country coverage
        run: python scripts/coverage_expand.py
      - name: Commit expanded snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json data/history/
          git diff --cached --quiet || git commit -m "data: expand country news coverage"
          git push
