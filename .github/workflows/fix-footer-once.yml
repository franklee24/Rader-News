name: Fix footer credit once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Temporarily automate footer credit update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update footer credit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<button class="btn" onclick="loadData()">↻ 刷新</button>'
          new = '<div style="color:var(--muted);font-size:11px;white-space:nowrap">designed by Lee, powered by ChatGPT</div>'
          if old not in s:
              raise SystemExit('refresh button pattern not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit page change and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-footer-once.yml
          git commit -m "Replace refresh button with footer credit"
          git push