name: Fix footer credit once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update footer credit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<button class="btn" onclick="loadData()">↻ 刷新</button>'
          new = '<div style="color:var(--muted);font-size:11px;white-space:nowrap">designed by Lee, powered by ChatGPT</div>'
          if old not in s:
              print('Footer credit already applied; nothing to do.')
              raise SystemExit(0)
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit page change
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace refresh button with footer credit"
          git push