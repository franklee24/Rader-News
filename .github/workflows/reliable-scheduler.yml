name: 雷达新闻可靠调度器

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reliable-scheduler.yml

permissions:
  actions: write
  contents: read

jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Wait for next checkpoint
        shell: bash
        run: |
          set -euo pipefail
          now=$(date +%s)
          today=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          hour=$(TZ=Asia/Shanghai date +%H)
          minute=$(TZ=Asia/Shanghai date +%M)
          current_minutes=$((10#$hour * 60 + 10#$minute))
          checkpoints=(0 240 480 720 960 1200)
          target_minutes=""
          for m in "${checkpoints[@]}"; do
            if [ "$m" -gt "$current_minutes" ]; then
              target_minutes="$m"
              break
            fi
          done
          if [ -z "$target_minutes" ]; then
            target_date=$(TZ=Asia/Shanghai date -d "tomorrow" +%Y-%m-%d)
            target=$(TZ=Asia/Shanghai date -d "$target_date 00:00:00" +%s)
          else
            target_hour=$((target_minutes / 60))
            target_minute=$((target_minutes % 60))
            target=$(TZ=Asia/Shanghai date -d "$today $(printf '%02d:%02d:00' "$target_hour" "$target_minute")" +%s)
          fi
          delay=$((target-now))
          echo "Waiting ${delay}s until Beijing $(TZ=Asia/Shanghai date -d @$target '+%Y-%m-%d %H:%M:%S')"
          if [ "$delay" -gt 0 ]; then sleep "$delay"; fi

      - name: Trigger radar update at 08:00
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          beijing_hour=$(TZ=Asia/Shanghai date +%H)
          beijing_minute=$(TZ=Asia/Shanghai date +%M)
          echo "Checkpoint: Beijing $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          if [ "$beijing_hour" = "08" ] && [ "$beijing_minute" -lt 10 ]; then
            gh workflow run daily.yml --repo franklee24/Rader-News --ref main
            echo "Daily radar update dispatched."
          else
            echo "Not the 08:00 checkpoint; no radar update dispatched."
          fi

      - name: Continue scheduler chain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 10
          gh workflow run reliable-scheduler.yml --repo franklee24/Rader-News --ref main
          echo "Next scheduler run dispatched."