name: 雷达新闻可靠调度器

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reliable-scheduler.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: radar-reliable-scheduler
  cancel-in-progress: true

jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Wait for next checkpoint
        shell: bash
        run: |
          set -euo pipefail
          now=$(date +%s)
          today=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          hour=$(TZ=Asia/Shanghai date +%H)
          minute=$(TZ=Asia/Shanghai date +%M)
          current_minutes=$((10#$hour * 60 + 10#$minute))
          checkpoints=(0 240 480 720 780 840 960 1200)
          target_minutes=""
          for m in "${checkpoints[@]}"; do
            if [ "$m" -gt "$current_minutes" ]; then
              target_minutes="$m"
              break
            fi
          done
          if [ -z "$target_minutes" ]; then
            target_date=$(TZ=Asia/Shanghai date -d "tomorrow" +%Y-%m-%d)
            target=$(TZ=Asia/Shanghai date -d "$target_date 00:00:00" +%s)
          else
            target_hour=$((target_minutes / 60))
            target_minute=$((target_minutes % 60))
            target=$(TZ=Asia/Shanghai date -d "$today $(printf '%02d:%02d:00' "$target_hour" "$target_minute")" +%s)
          fi
          delay=$((target-now))
          echo "Waiting ${delay}s until Beijing $(TZ=Asia/Shanghai date -d @$target '+%Y-%m-%d %H:%M:%S')"
          if [ "$delay" -gt 0 ]; then sleep "$delay"; fi

      - name: Trigger radar update when due
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          beijing_hour=$(TZ=Asia/Shanghai date +%H)
          beijing_minute=$(TZ=Asia/Shanghai date +%M)
          echo "Checkpoint: Beijing $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"

          generated_date=""
          if daily_json=$(curl -fsSL --max-time 20 https://raw.githubusercontent.com/franklee24/Rader-News/main/data/daily.json); then
            generated_date=$(printf '%s' "$daily_json" | python -c 'import json,sys; d=json.load(sys.stdin); print(str(d.get("generated_beijing", ""))[:10])')
          fi
          echo "Today: $today; current generated date: ${generated_date:-unknown}"

          # Run at 08:00 every day. Also catch up at every later checkpoint
          # whenever today's snapshot has not been generated yet.
          if { [ "$beijing_hour" = "08" ] && [ "$beijing_minute" -lt 10 ]; } || [ "$generated_date" != "$today" ]; then
            gh workflow run daily.yml --repo franklee24/Rader-News --ref main
            echo "Daily radar update dispatched."
          else
            echo "Today's radar snapshot already exists; no update needed at this checkpoint."
          fi

      - name: Continue scheduler chain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 10
          gh workflow run reliable-scheduler.yml --repo franklee24/Rader-News --ref main
          echo "Next scheduler run dispatched."
