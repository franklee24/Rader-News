name: 雷达新闻可靠调度器

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reliable-scheduler.yml

permissions:
  actions: write
  contents: read

jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Wait for checkpoint
        shell: bash
        run: |
          set -euo pipefail
          now=$(date +%s)
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            target=$((now + 90))
          else
            today=$(TZ=Asia/Shanghai date +%Y-%m-%d)
            target=$(TZ=Asia/Shanghai date -d "$today 08:00:00" +%s)
            if [ "$target" -le "$now" ]; then
              target=$(TZ=Asia/Shanghai date -d "tomorrow 08:00:00" +%s)
            fi
          fi
          delay=$((target-now))
          echo "Waiting ${delay}s until $(date -d @$target --iso-8601=seconds)"
          if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
      - name: Trigger radar update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Scheduler checkpoint: Beijing $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          gh workflow run daily.yml --repo franklee24/Rader-News --ref main
      - name: Continue scheduler daemon
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 10
          gh workflow run reliable-scheduler.yml --repo franklee24/Rader-News --ref main
# validation-repair retrigger