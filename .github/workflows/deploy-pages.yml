name: Deploy Pages on Push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Inject title translations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- title-translation-runtime -->'
          if marker not in s:
              script=r'''<script>
              /* title-translation-runtime: only adds Chinese translations below English titles; does not alter existing UI */
              (async()=>{try{
                const r=await fetch('./data/daily.json?ts='+Date.now(),{cache:'no-store'}); const d=await r.json(); const m=new Map();
                const walk=x=>{if(!x||typeof x!=='object')return;if(Array.isArray(x)){x.forEach(walk);return}if(typeof x.title==='string'&&typeof x.title_zh==='string'&&x.title_zh.trim())m.set(x.title.trim(),x.title_zh.trim());Object.values(x).forEach(walk)}; walk(d);
                const add=()=>document.querySelectorAll('.event h3').forEach(h=>{if(h.dataset.zhDone)return;const zh=m.get(h.textContent.trim());if(!zh)return;h.dataset.zhDone='1';const el=document.createElement('div');el.className='zh-title';el.textContent=zh;h.insertAdjacentElement('afterend',el)});
                const st=document.createElement('style');st.textContent='.zh-title{margin:-3px 0 7px;color:#b8c8da;font-size:12px;line-height:1.45;font-weight:500}';document.head.appendChild(st);add();new MutationObserver(add).observe(document.body,{childList:true,subtree:true});
              }catch(e){console.warn('title translation failed',e)}})();
              </script>'''
              s=s.replace('</body>', marker+script+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: One-time launch of repaired daily pipeline
        if: github.event_name == 'push' && github.event.head_commit.message == 'test: launch repaired daily pipeline now'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run daily.yml --ref main
