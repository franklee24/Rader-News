name: 雷达新闻每日更新

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_daily.py'
      - 'scripts/score_importance.py'
      - 'scripts/test_china_priority.py'
      - 'scripts/translate_titles.py'
      - '.github/workflows/daily.yml'
  workflow_dispatch:
# 北京时间每天 06:00、17:00（GitHub Actions cron 使用 UTC；实际启动可能略有延迟）
  # Scheduled production runs are dispatched by reliable-scheduler.yml only,
  # preventing simultaneous cron triggers from cancelling each other.

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-production
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Preserve previous published edition for cross-run deduplication
        run: |
          if [ -s data/daily.json ]; then cp data/daily.json /tmp/previous_edition.json; else printf '{}' > /tmp/previous_edition.json; fi
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Use checked-in news-source configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('scripts/build_daily.py').read_text(encoding='utf-8')
          if 'multi-source-event-first-direct-rss' not in text:
              raise SystemExit('SOURCE CONFIGURATION CHECK FAILED')
          if '中文优先' in text or 'en_cap=max(2' in text:
              raise SystemExit('LEGACY CHINESE-FIRST LOGIC DETECTED')
          if 'Coverage-India' in text or 'Coverage-United States' in text:
              raise SystemExit('LEGACY COUNTRY COVERAGE FEEDS DETECTED')
          if 'AI_FEEDS' not in text or "report['ai_news']=ai_selected[:20]" not in text:
              raise SystemExit('AI/LLM NEWS CONFIGURATION MISSING')
          for source in ('Reuters China','BBC China','Associated Press China','New York Times China','Wall Street Journal China','Bloomberg China','Financial Times China','The Economist China'):
              if source not in text: raise SystemExit('INTERNATIONAL CHINA SOURCE MISSING: '+source)
          if 'def fetch_china_investigation_search' not in text or 'def fetch_priority_china_fallback' not in text or 'def rank_china_events' not in text:
              raise SystemExit('CHINA INVESTIGATION DISCOVERY/RANKING RULE MISSING')
          print('Checked-in sources, China investigation discovery/ranking, international China coverage and AI/LLM module are active.')
          PY
      - name: Test China priority rules
        run: python scripts/test_china_priority.py
      - name: Build daily news
        run: python scripts/build_daily.py
      - name: Verify source reliability report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/source_health.json')
          if not p.exists(): raise SystemExit('SOURCE HEALTH REPORT MISSING')
          report=json.loads(p.read_text(encoding='utf-8'))
          if not report.get('runs') or not report.get('sources'):
              raise SystemExit('SOURCE HEALTH REPORT EMPTY')
          for source in report['sources']:
              if not 0 <= source.get('success_rate',-1) <= 1:
                  raise SystemExit('INVALID SOURCE SUCCESS RATE: '+str(source.get('source')))
          latest=report['runs'][-1]
          failed=[x for x in latest.get('observations',[]) if x.get('status')=='failed']
          empty=[x for x in latest.get('observations',[]) if x.get('status')=='empty']
          print('SOURCE HEALTH REPORT PASSED; retained runs:',len(report['runs']),'sources:',len(report['sources']))
          print('Latest run failed sources:',[(x['source'],x.get('error')) for x in failed])
          print('Latest run sources returned zero items:',[x['source'] for x in empty])
          PY
      - name: Verify current high-priority China story
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          now=datetime.now(timezone.utc)
          published=datetime(2026,10,13,10,0,tzinfo=timezone.utc)
          if now <= published + timedelta(hours=72):
              data=json.loads(Path('data/daily.json').read_text(encoding='utf-8'))
              events=data.get('tiers',{}).get('tier1',{}).get('中国',{}).get('events',[])
              matches=[(i,e) for i,e in enumerate(events) if any(k in ((e.get('title') or '')+' '+(e.get('title_zh') or '')) for k in ['黄奇帆','Huang Qifan','huang qifan'])]
              if not matches:
                  raise SystemExit('QUALITY GATE FAILED: Huang Qifan story missing from China section; check CCDI source fetch/parser.')
              index,event=matches[0]
              if index>=5 or int(event.get('importance',0))<95:
                  raise SystemExit(f'QUALITY GATE FAILED: Huang Qifan story ranked #{index+1} with score {event.get("importance")}; expected top 5 and score >=95.')
              print(f'CRITICAL CHINA STORY GATE PASSED: rank #{index+1}, score {event.get("importance")}')
          else:
              print('Time-limited Huang Qifan live-story gate expired; synthetic regression test remains active.')
          PY
      - name: Apply V22 importance scoring
        run: python scripts/score_importance.py
      - name: Remove repeats and undated events
        run: |
          python - <<'PY'
          import json,re
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          BJ=timezone(timedelta(hours=8)); UTC=timezone.utc; root=Path('.')
          daily=root/'data/daily.json'; d=json.loads(daily.read_text(encoding='utf-8'))
          now=datetime.now(UTC).astimezone(BJ); anchor=now.replace(hour=8,minute=0,second=0,microsecond=0)
          if now<anchor: anchor-=timedelta(days=1)
          prev_date=(anchor.date()-timedelta(days=1)).isoformat(); pp=root/'data/history'/f'{prev_date}.json'
          prev=json.loads(pp.read_text(encoding='utf-8')) if pp.exists() else {}
          snapshot=Path('/tmp/previous_edition.json')
          previous_edition=json.loads(snapshot.read_text(encoding='utf-8')) if snapshot.exists() else {}
          # Keep country pages comprehensive across morning/evening editions.
          # Previous-edition suppression applies ONLY to GLOBAL TOP, never to country sections.
          norm=lambda s: re.sub(r'[^0-9a-z\u4e00-\u9fff]+',' ',(s or '').lower()).strip()
          prev_top_keys=set(); prev_top_urls=set(); prev_top_titles=set()
          def add_prev_top(e):
              if e.get('id'): prev_top_keys.add(e['id'])
              if e.get('url'): prev_top_urls.add(e['url'])
              if e.get('source_url'): prev_top_urls.add(e['source_url'])
              title=norm(e.get('title') or e.get('title_zh') or '')
              if title: prev_top_titles.add(title)
          for edition in (previous_edition, prev):
              for e in edition.get('global_top',[]): add_prev_top(e)
          # Keep all dated country stories from the 24-hour collection window, including stories
          # that appeared in the prior edition. Repetition is controlled in GLOBAL TOP instead.
          undated=0
          for tier in d.get('tiers',{}).values():
              for c in tier.values():
                  keep=[]
                  for e in c.get('events',[]):
                      if not e.get('published_at'): undated+=1; continue
                      keep.append(e)
                  limit=min(30,int(c.get('target_max') or 30))
                  c['events']=keep[:limit]
                  c['count']=len(c['events'])
          removed=0
          # Drop the duplicate description field after scoring; the UI uses summary.
          for tier in d.get('tiers',{}).values():
              for country in tier.values():
                  for e in country.get('events',[]): e.pop('description',None)
          for e in d.get('supplement',[]): e.pop('description',None)
          for e in d.get('ai_news',[]): e.pop('description',None)
          # Enforce a hard cap of 30 stories per country across all tiers; configured target_max remains the normal lower target.
          country_events={}
          for tier_name,tier in d.get('tiers',{}).items():
              for country,c in tier.items():
                  for e in c.get('events',[]):
                      key=(e.get('code') or country or '').strip()
                      country_events.setdefault(key,[]).append((tier_name,country,e))
          allowed={}
          for key,rows in country_events.items():
              rows.sort(key=lambda row:(int(row[2].get('importance',0)),row[2].get('published_at') or ''),reverse=True)
              allowed[key]={row[2].get('id') or norm(row[2].get('title')) for row in rows[:30]}
          capped=0
          for tier_name,tier in d.get('tiers',{}).items():
              for country,c in tier.items():
                  key=(c.get('code') or country or '').strip()
                  before=len(c.get('events',[]))
                  c['events']=[e for e in c.get('events',[]) if (e.get('id') or norm(e.get('title'))) in allowed.get(key,set())]
                  c['count']=len(c['events']); capped+=before-len(c['events'])
          print('Hard cap: max 30 events per country across all tiers; removed over-cap events:',capped)
          # Rebuild GLOBAL TOP from the final post-deduplication country lists.
          current=[e for tier in d.get('tiers',{}).values() for c in tier.values() for e in c.get('events',[])]
          current.extend(d.get('supplement',[]))
          unique=[]; seen=set()
          # Ordinary local/provincial discipline notices remain in China political news,
          # but are not eligible for GLOBAL TOP without clear national-level significance.
          investigation_terms=['接受审查调查','纪律审查','监察调查','涉嫌严重违纪违法','under investigation','corruption investigation']
          exceptional_terms=['政治局','中央政治局','中央委员','中央候补委员','中共中央','中央军委','国家主席','国务院总理','systemic corruption','politburo','prime minister','president of china']
          def ordinary_local_investigation(e):
              title=(e.get('title') or '')+' '+(e.get('title_zh') or '')+' '+(e.get('summary') or '')
              low=title.lower()
              is_investigation=any(k.lower() in low for k in investigation_terms)
              exceptional=any(k.lower() in low for k in exceptional_terms)
              return is_investigation and not exceptional
          for e in sorted(current,key=lambda x:(x.get('importance',0),x.get('published_at') or ''),reverse=True):
              key=e.get('id') or norm(e.get('title') or e.get('title_zh') or '')
              title=norm(e.get('title') or e.get('title_zh') or '')
              url=e.get('url') or e.get('source_url') or ''
              if not key or key in seen: continue
              if key in prev_top_keys or (url and url in prev_top_urls) or (title and title in prev_top_titles):
                  removed+=1; continue
              if ordinary_local_investigation(e): continue
              seen.add(key); unique.append(e)
          # Rank GLOBAL TOP by event significance, not source prestige or country-section order.
          # A deterministic, fully free ranking pass adds a soft diversity penalty; it does not reserve fixed slots for categories.
          def global_topic(e):
              t=norm((e.get('title') or '')+' '+(e.get('title_zh') or '')+' '+(e.get('summary') or '')+' '+(e.get('category') or ''))
              rules=[
                ('war_conflict',['war','warfare','invasion','ukraine','russia','俄乌','战争','俄军','乌克兰','停火','空袭','missile','导弹','ceasefire']),
                ('macro_economy',['gdp','quarterly economy','economic growth','inflation','interest rate','central bank','economy','经济','gdp','第三季度','季度经济','通胀','央行','利率','就业','房地产']),
                ('us_politics',['trump','white house','us president','tariff','特朗普','白宫','美国总统','关税','美国政府']),
                ('protests_politics',['protest','demonstration','strike','riot','manifestation','游行','示威','罢工','抗议']),
                ('china_official_investigation',['纪律审查','监察调查','接受审查调查','涉嫌严重违纪违法','中央纪委','国家监委','被查','corruption investigation','under investigation']),
                ('disaster_health',['earthquake','flood','hurricane','plague','outbreak','地震','洪水','飓风','疫情','灾害','重大事故']),
                ('technology_science',['artificial intelligence','technology','semiconductor','scientific','ai model','人工智能','科技','芯片','科研','重大突破']),
                ('diplomacy_security',['summit','treaty','sanctions','diplomacy','外交','峰会','条约','制裁','北约','nato']),
              ]
              for topic,words in rules:
                  if any(w in t for w in words): return topic
              return 'other'
          # Importance remains the primary signal. Freshness breaks ties; source count supports verification but does not dominate.
          def global_score(e):
              base=int(e.get('importance') or 0)
              pub=e.get('published_at') or ''
              return (base, pub, int(e.get('source_count') or len(e.get('sources',[]))))
          ranked=sorted(unique,key=global_score,reverse=True)
          chosen=[]; topic_counts={}; chosen_keys=set()
          for e in ranked:
              key=e.get('id') or norm(e.get('title') or e.get('title_zh') or '')
              topic=global_topic(e)
              # Soft cap for repeated topics near the top, not a hard exclusion.
              # A strong outlier can still enter; same-topic follow-ups may re-enter when materially more important.
              if len(chosen)<5 and topic_counts.get(topic,0)>=1:
                  top_score=int(chosen[0].get('importance') or 0) if chosen else 0
                  if int(e.get('importance') or 0)<top_score-12:
                      continue
              if len(chosen)>=5 and topic_counts.get(topic,0)>=2:
                  top_score=int(chosen[0].get('importance') or 0) if chosen else 0
                  if int(e.get('importance') or 0)<top_score-8:
                      continue
              if key in chosen_keys: continue
              chosen.append(e); chosen_keys.add(key); topic_counts[topic]=topic_counts.get(topic,0)+1
              if len(chosen)>=10: break
          # If soft diversity rules leave gaps, fill remaining positions by raw importance.
          if len(chosen)<10:
              for e in ranked:
                  key=e.get('id') or norm(e.get('title') or e.get('title_zh') or '')
                  if key and key not in chosen_keys:
                      chosen.append(e); chosen_keys.add(key)
                      if len(chosen)>=10: break
          d['global_top']=chosen
          d['global_top_ranking']={'version':'V23','method':'global-event eligibility gate + previous-edition suppression for GLOBAL TOP only + importance-first soft topic diversity; country sections retain dated stories','topic_counts':topic_counts}
          d['stats']['events']=sum(c.get('count',0) for t in d.get('tiers',{}).values() for c in t.values())
          d['stats']['tier1_events']=sum(c.get('count',0) for c in d.get('tiers',{}).get('tier1',{}).values())
          d['stats']['supplement_events']=len(d.get('supplement',[]))
          d['dedupe_previous_edition']={'previous_date':prev_date,'removed':removed,'undated_removed':undated,'buffered_candidates_used':True}
          daily.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          (root/'data/history'/f'{anchor.date().isoformat()}.json').write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Removed previous-edition repeats from GLOBAL TOP:',removed,'undated country events removed:',undated,'country sections are not cross-edition deduped')
          PY
      - name: Cache offline translation model
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.config/argos-translate
          key: argos-en-zh-v2-${{ runner.os }}-py312
      - name: Install required offline English-to-Chinese model
        timeout-minutes: 15
        run: |
          python -m pip install --upgrade argostranslate
          argospm update
          argospm install translate-en_zh
          python - <<'PY'
          import argostranslate.translate
          languages=argostranslate.translate.get_installed_languages()
          en=next((x for x in languages if x.code=='en'),None)
          zh=next((x for x in languages if x.code=='zh'),None)
          if not (en and zh and en.get_translation(zh)):
              raise SystemExit('REQUIRED OFFLINE EN-ZH MODEL NOT AVAILABLE')
          print('Required Argos English-to-Chinese model is ready.')
          PY
      - name: Translate all English titles
        run: python scripts/translate_titles.py
      - name: Validate headline translations
        run: |
          python - <<'PY3'
          import json,re
          from pathlib import Path
          d=json.loads(Path('data/daily.json').read_text(encoding='utf-8'))
          events=[]
          for tier in d.get('tiers',{}).values():
              for country in tier.values(): events.extend(country.get('events',[]))
          events.extend(d.get('global_top',[])); events.extend(d.get('supplement',[])); events.extend(d.get('ai_news',[]))
          def english(s):
              s=str(s or '').strip()
              return bool(s) and not re.search(r'[\u3400-\u9fff]',s) and len(re.findall(r'[A-Za-z]',s))>=8 and len(re.findall(r'[A-Za-z]',s))/max(1,len(re.sub(r'\s+','',s)))>=0.45
          def usable(title,result):
              title=str(title or '').strip(); result=str(result or '').strip()
              if not result or not re.search(r'[\u3400-\u9fff]',result) or result==title: return False
              tw=max(1,len(re.findall(r'\b[A-Za-z0-9]+\b',title)))
              rw=len(re.findall(r'\b[A-Za-z0-9]+\b',result))
              han=len(re.findall(r'[\u3400-\u9fff]',result))
              if han>=4 and len(result)>=5: return True
              if tw>=8 and rw<max(2,round(tw*.28)) and han<max(7,round(len(title)*.12)): return False
              if len(result)<min(8,max(1,round(len(title)*.18))): return False
              return True
          bad=[e.get('title','') for e in events if english(e.get('title')) and not usable(e.get('title'),e.get('title_zh'))]
          if bad:
              print('Missing or incomplete Chinese translations:',len(bad)); print('\\n'.join(bad[:20])); raise SystemExit('HEADLINE TRANSLATION QUALITY GATE FAILED')
          print('HEADLINE TRANSLATION QUALITY GATE PASSED; visible English headlines:',sum(1 for e in events if english(e.get('title'))))
          PY3
      - name: Validate event quality
        run: |
          python - <<'PY2'
          import json
          from pathlib import Path
          d=json.loads(Path('data/daily.json').read_text(encoding='utf-8'))
          events=[e for tier in d.get('tiers',{}).values() for c in tier.values() for e in c.get('events',[]) if e.get('published_at')]
          if len(events)<40: raise SystemExit('QUALITY GATE FAILED: too few events')
          if not any((e.get('source_authority') or 0)>=85 for e in events):
              raise SystemExit('QUALITY GATE FAILED: no high-authority international source represented')
          print('QUALITY GATE PASSED; events:',len(events),'high-authority:',sum(1 for e in events if (e.get('source_authority') or 0)>=85))
          PY2
      - name: Commit daily snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json data/history/ data/source_health.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "data: update daily radar"
            git restore scripts/build_daily.py
            git fetch origin main
            GIT_EDITOR=true git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
