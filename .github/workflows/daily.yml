name: 雷达新闻每日更新

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'index.html'
      - '.github/workflows/daily.yml'
  schedule:
    # GitHub cron uses UTC: Beijing 08:00 = UTC 00:00
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-production
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Lock builder window and expand country coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_daily.py'); text=p.read_text(encoding='utf-8')
          old="now=dt.datetime.now(dt.timezone.utc); cutoff=now-dt.timedelta(hours=25)"
          new="now=dt.datetime.now(dt.timezone.utc); bj=dt.datetime.now(dt.timezone(dt.timedelta(hours=8))); anchor=bj.replace(hour=8,minute=0,second=0,microsecond=0); anchor=anchor-dt.timedelta(days=1) if bj < anchor else anchor; cutoff=anchor.astimezone(dt.timezone.utc)-dt.timedelta(days=1)"
          if old not in text: raise SystemExit('WINDOW PATCH FAILED')
          text=text.replace(old,new)
          old2='if p and p<cutoff:continue'; new2='if p and (p<cutoff or p>=anchor):continue'
          if old2 not in text: raise SystemExit('UPPER WINDOW PATCH FAILED')
          text=text.replace(old2,new2)

          # Existing extra high-quality feeds.
          marker=" # English secondary"
          additions="""
 ('Guardian UK','GB','https://www.theguardian.com/uk/rss','en'),
 ('Moscow Times','RU','https://www.themoscowtimes.com/rss/news','en'),
 ('NPR Politics','US','https://feeds.npr.org/1014/rss.xml','en'),
 ('NPR Economy','US','https://feeds.npr.org/1017/rss.xml','en'),
 ('NPR Technology','US','https://feeds.npr.org/1019/rss.xml','en'),
 ('AP US','US','https://apnews.com/hub/us-news?format=rss','en'),
 ('CNN US','US','https://rss.cnn.com/rss/edition_us.rss','en'),
 ('NYT US','US','https://rss.nytimes.com/services/xml/rss/nyt/US.xml','en'),
 ('TASS Politics','RU','https://tass.com/politics/?cmd=rss&ver=1.0','en'),
 ('TASS Economy','RU','https://tass.com/economy/?cmd=rss&ver=1.0','en'),
"""
          if "('NPR Politics','US'" not in text:
              if marker not in text: raise SystemExit('SOURCE PATCH FAILED')
              text=text.replace(marker, additions+marker)

          # Dedicated fallback search feeds for every configured country.
          coverage="""
 ('Coverage-India','IN','https://news.google.com/rss/search?q=India+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-Brazil','BR','https://news.google.com/rss/search?q=Brazil+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-Saudi Arabia','SA','https://news.google.com/rss/search?q=Saudi+Arabia+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-South Korea','KR','https://news.google.com/rss/search?q=South+Korea+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-Canada','CA','https://news.google.com/rss/search?q=Canada+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-Australia','AU','https://news.google.com/rss/search?q=Australia+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-Ukraine','UA','https://news.google.com/rss/search?q=Ukraine+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-Italy','IT','https://news.google.com/rss/search?q=Italy+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-Indonesia','ID','https://news.google.com/rss/search?q=Indonesia+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-Turkey','TR','https://news.google.com/rss/search?q=Turkey+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-United Arab Emirates','AE','https://news.google.com/rss/search?q=United+Arab+Emirates+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-Mexico','MX','https://news.google.com/rss/search?q=Mexico+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-Iran','IR','https://news.google.com/rss/search?q=Iran+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-Switzerland','CH','https://news.google.com/rss/search?q=Switzerland+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-Singapore','SG','https://news.google.com/rss/search?q=Singapore+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-South Africa','ZA','https://news.google.com/rss/search?q=South+Africa+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-Netherlands','NL','https://news.google.com/rss/search?q=Netherlands+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-Israel','IL','https://news.google.com/rss/search?q=Israel+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-Spain','ES','https://news.google.com/rss/search?q=Spain+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-Egypt','EG','https://news.google.com/rss/search?q=Egypt+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-Nigeria','NG','https://news.google.com/rss/search?q=Nigeria+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-Argentina','AR','https://news.google.com/rss/search?q=Argentina+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-Poland','PL','https://news.google.com/rss/search?q=Poland+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-Vietnam','VN','https://news.google.com/rss/search?q=Vietnam+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-United States','US','https://news.google.com/rss/search?q=United+States+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-China','CN','https://news.google.com/rss/search?q=China+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-United Kingdom','GB','https://news.google.com/rss/search?q=United+Kingdom+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-France','FR','https://news.google.com/rss/search?q=France+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-Germany','DE','https://news.google.com/rss/search?q=Germany+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-Russia','RU','https://news.google.com/rss/search?q=Russia+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
 ('Coverage-Japan','JP','https://news.google.com/rss/search?q=Japan+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),
"""
          if "('Coverage-India','IN'" not in text:
              if marker not in text: raise SystemExit('COVERAGE INSERT FAILED')
              text=text.replace(marker, coverage+marker)

          old3="en_cap=max(2,int(c['max']*0.20))"; new3="en_cap=max(4,int(c['max']*0.50))"
          if old3 not in text: raise SystemExit('EN CAP PATCH FAILED')
          text=text.replace(old3,new3)
          old4="zh=[s for s in srcs if s.get('language')=='cn']; best=(zh or srcs)[0]"
          new4="local=[s for s in srcs if s.get('feed_country')==e.get('code')]; zh=[s for s in srcs if s.get('language')=='cn']; en=[s for s in srcs if s.get('language')=='en']; best=(local or zh or en or srcs)[0]"
          if old4 in text: text=text.replace(old4,new4)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Build daily news
        run: python scripts/build_daily.py
      - name: Apply V20 importance scoring
        run: python scripts/score_importance.py
      - name: Remove repeats and undated events
        run: |
          python - <<'PY'
          import json,re
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          BJ=timezone(timedelta(hours=8)); UTC=timezone.utc; root=Path('.')
          daily=root/'data/daily.json'; d=json.loads(daily.read_text(encoding='utf-8'))
          now=datetime.now(UTC).astimezone(BJ); anchor=now.replace(hour=8,minute=0,second=0,microsecond=0)
          if now<anchor: anchor-=timedelta(days=1)
          prev_date=(anchor.date()-timedelta(days=1)).isoformat(); pp=root/'data/history'/f'{prev_date}.json'
          prev=json.loads(pp.read_text(encoding='utf-8')) if pp.exists() else {}
          ids=set(); urls=set(); titles=set(); norm=lambda s: re.sub(r'[^0-9a-z\u4e00-\u9fff]+',' ',(s or '').lower()).strip()
          def add(e):
              if e.get('id'): ids.add(e['id'])
              if e.get('url'): urls.add(e['url'])
              if e.get('source_url'): urls.add(e['source_url'])
              if e.get('title'): titles.add(norm(e['title']))
          for tier in prev.get('tiers',{}).values():
              for c in tier.values():
                  for e in c.get('events',[]): add(e)
          for e in prev.get('supplement',[]): add(e)
          removed=0; undated=0
          for tier in d.get('tiers',{}).values():
              for c in tier.values():
                  keep=[]
                  for e in c.get('events',[]):
                      if not e.get('published_at'): undated+=1; continue
                      if e.get('id') in ids or e.get('url') in urls or norm(e.get('title')) in titles: removed+=1
                      else: keep.append(e)
                  c['events']=keep; c['count']=len(keep)
          d['stats']['events']=sum(c.get('count',0) for t in d.get('tiers',{}).values() for c in t.values())
          d['stats']['tier1_events']=sum(c.get('count',0) for c in d.get('tiers',{}).get('tier1',{}).values())
          d['dedupe_previous_edition']={'previous_date':prev_date,'removed':removed,'undated_removed':undated}
          daily.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'data/history'/f'{anchor.date().isoformat()}.json').write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Removed repeats:',removed,'undated:',undated)
          PY
      - name: Validate fixed window and country coverage
        run: |
          python - <<'PY'
          import json
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          BJ=timezone(timedelta(hours=8)); UTC=timezone.utc; d=json.loads(Path('data/daily.json').read_text(encoding='utf-8'))
          now=datetime.now(UTC).astimezone(BJ); anchor=now.replace(hour=8,minute=0,second=0,microsecond=0)
          if now<anchor: anchor-=timedelta(days=1)
          start=anchor-timedelta(days=1); end=anchor; su=start.astimezone(UTC); eu=end.astimezone(UTC)
          events=[e for tier in d.get('tiers',{}).values() for c in tier.values() for e in c.get('events',[])]
          if not events: raise SystemExit('QUALITY GATE FAILED: no events')
          for e in events:
              t=datetime.fromisoformat(e['published_at'].replace('Z','+00:00')).astimezone(UTC)
              if t<su or t>=eu: raise SystemExit('QUALITY GATE FAILED: event outside fixed window: '+e.get('title',''))
          cfg=json.loads(Path('config/country_tiers.json').read_text(encoding='utf-8'))
          coverage=[]
          for tier_name,countries in cfg['tiers'].items():
              for c in countries:
                  ev=[e for e in events if e.get('event_country')==c['name']]
                  src={s.get('source') for e in ev for s in e.get('sources',[]) if s.get('source')}
                  if len(ev)==0: coverage.append(f"{tier_name}:{c['name']}")
          if coverage: raise SystemExit('COUNTRY COVERAGE GATE FAILED: zero-event countries: '+', '.join(coverage))
          tier1=[c['name'] for c in cfg['tiers']['tier1']]
          warnings={}
          for country in tier1:
              ev=[e for e in events if e.get('event_country')==country]
              src={s.get('source') for e in ev for s in e.get('sources',[]) if s.get('source')}
              if len(ev)<8 or len(src)<3: warnings[country]={'events':len(ev),'sources':len(src)}
          print('QUALITY GATE PASSED',start,end)
          if warnings: print('TIER1 COVERAGE WARNINGS:',warnings)
          PY
      - name: Commit daily snapshot
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json data/history/
          git diff --cached --quiet || git commit -m "data: update daily radar"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
