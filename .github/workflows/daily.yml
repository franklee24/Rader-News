name: 雷达新闻每日更新

on:
  workflow_dispatch:
  schedule:
    - cron: '7 0 * * *'
    - cron: '37 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-production
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Lock builder window, expand country coverage and set source priority
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_daily.py'); text=p.read_text(encoding='utf-8')
          old="now=dt.datetime.now(dt.timezone.utc); cutoff=now-dt.timedelta(hours=25)"
          new="now=dt.datetime.now(dt.timezone(dt.timedelta(hours=8))); cutoff=now-dt.timedelta(hours=25)"
          if old not in text: raise SystemExit('WINDOW PATCH FAILED')
          text=text.replace(old,new)
          old2='if p and p<cutoff:continue'; new2='if p and p<cutoff:continue'
          if old2 not in text: raise SystemExit('UPPER WINDOW PATCH FAILED')
          marker=" # English secondary"
          additions=" ('Guardian UK','GB','https://www.theguardian.com/uk/rss','en'),\n ('Moscow Times','RU','https://www.themoscowtimes.com/rss/news','en'),\n ('NPR Politics','US','https://feeds.npr.org/1014/rss.xml','en'),\n ('NPR Economy','US','https://feeds.npr.org/1017/rss.xml','en'),\n ('NPR Technology','US','https://feeds.npr.org/1019/rss.xml','en'),\n ('AP US','US','https://apnews.com/hub/us-news?format=rss','en'),\n ('CNN US','US','https://rss.cnn.com/rss/edition_us.rss','en'),\n ('NYT US','US','https://rss.nytimes.com/services/xml/rss/nyt/US.xml','en'),\n ('TASS Politics','RU','https://tass.com/politics/?cmd=rss&ver=1.0','en'),\n ('TASS Economy','RU','https://tass.com/economy/?cmd=rss&ver=1.0','en'),\n"
          if "('NPR Politics','US'" not in text:
              if marker not in text: raise SystemExit('SOURCE PATCH FAILED')
              text=text.replace(marker, additions+marker)
          intl_marker=" ('BBC中文','GLOBAL','https://feeds.bbci.co.uk/zhongwen/simp/rss.xml','cn'),"
          intl_add=" ('纽约时报中文网','GLOBAL','https://cn.nytimes.com/rss/','cn'),\n"
          if "('纽约时报中文网','GLOBAL'" not in text:
              if intl_marker not in text: raise SystemExit('NYT CHINESE SOURCE PATCH FAILED')
              text=text.replace(intl_marker, intl_marker+"\n"+intl_add)
          countries={'IN':'India','BR':'Brazil','SA':'Saudi Arabia','KR':'South Korea','CA':'Canada','AU':'Australia','UA':'Ukraine','IT':'Italy','ID':'Indonesia','TR':'Turkey','AE':'United Arab Emirates','MX':'Mexico','IR':'Iran','CH':'Switzerland','SG':'Singapore','ZA':'South Africa','NL':'Netherlands','IL':'Israel','ES':'Spain','EG':'Egypt','NG':'Nigeria','AR':'Argentina','PL':'Poland','VN':'Vietnam','US':'United States','CN':'China','GB':'United Kingdom','FR':'France','DE':'Germany','RU':'Russia','JP':'Japan'}
          coverage=''.join(f" ('Coverage-{name}','{code}','https://news.google.com/rss/search?q={name.replace(' ','+')}+news+when%3A2d&hl=en-US&gl=US&ceid=US:en','en'),\n" for code,name in countries.items())
          if "('Coverage-India','IN'" not in text:
              if marker not in text: raise SystemExit('COVERAGE INSERT FAILED')
              text=text.replace(marker, coverage+marker)
          old3="en_cap=max(2,int(c['max']*0.20))"; new3="en_cap=max(4,int(c['max']*0.50))"
          if old3 not in text: raise SystemExit('EN CAP PATCH FAILED')
          text=text.replace(old3,new3)
          old4="zh=[s for s in srcs if s.get('language')=='cn']; best=(zh or srcs)[0]"
          new4="local=[s for s in srcs if s.get('feed_country')==e.get('code') and s.get('source') not in {'Coverage-'+str(e.get('event_country',''))}]; western=[s for s in srcs if s.get('source') in {'Reuters World','BBC World','AP World','Guardian UK','NPR','NPR Politics','NPR Economy','NPR Technology','AP US','CNN US','NYT US','BBC UK','France24','DW','TASS','TASS Politics','TASS Economy','NHK','Moscow Times'}]; intl_zh=[s for s in srcs if s.get('source') in {'BBC中文','纽约时报中文网','路透中文','法广中文','联合早报'}]; other_en=[s for s in srcs if s.get('language')=='en']; mainland=[s for s in srcs if s.get('language')=='cn' and s.get('source') not in {'BBC中文','纽约时报中文网','路透中文','法广中文','联合早报'}]; best=(local or western or intl_zh or other_en or mainland or srcs)[0]"
          if old4 not in text: raise SystemExit('SOURCE PRIORITY PATCH FAILED')
          text=text.replace(old4,new4)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Build daily news
        run: python scripts/build_daily.py
      - name: Apply V20 importance scoring
        run: python scripts/score_importance.py
      - name: Translate English titles only
        run: python scripts/translate_titles.py
      - name: Remove repeats and undated events
        run: |
          python - <<'PY'
          import json,re
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          BJ=timezone(timedelta(hours=8)); UTC=timezone.utc; root=Path('.')
          daily=root/'data/daily.json'; d=json.loads(daily.read_text(encoding='utf-8'))
          now=datetime.now(UTC).astimezone(BJ); anchor=now.replace(hour=8,minute=0,second=0,microsecond=0)
          if now<anchor: anchor-=timedelta(days=1)
          prev_date=(anchor.date()-timedelta(days=1)).isoformat(); pp=root/'data/history'/f'{prev_date}.json'
          prev=json.loads(pp.read_text(encoding='utf-8')) if pp.exists() else {}
          ids=set(); urls=set(); titles=set(); norm=lambda s: re.sub(r'[^0-9a-z\u4e00-\u9fff]+',' ',(s or '').lower()).strip()
          def add(e):
              if e.get('id'): ids.add(e['id'])
              if e.get('url'): urls.add(e['url'])
              if e.get('source_url'): urls.add(e['source_url'])
              if e.get('title'): titles.add(norm(e['title']))
          for tier in prev.get('tiers',{}).values():
              for c in tier.values():
                  for e in c.get('events',[]): add(e)
          for e in prev.get('supplement',[]): add(e)
          removed=0; undated=0
          for tier in d.get('tiers',{}).values():
              for c in tier.values():
                  keep=[]
                  for e in c.get('events',[]):
                      if not e.get('published_at'): undated+=1; continue
                      if e.get('id') in ids or e.get('url') in urls or norm(e.get('title')) in titles: removed+=1
                      else: keep.append(e)
                  c['events']=keep; c['count']=len(keep)
          d['stats']['events']=sum(c.get('count',0) for t in d.get('tiers',{}).values() for c in t.values())
          d['stats']['tier1_events']=sum(c.get('count',0) for c in d.get('tiers',{}).get('tier1',{}).values())
          d['dedupe_previous_edition']={'previous_date':prev_date,'removed':removed,'undated_removed':undated}
          daily.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'data/history'/f'{anchor.date().isoformat()}.json').write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Removed repeats:',removed,'undated:',undated)
          PY
      - name: Validate radar coverage
        run: |
          python - <<'PY2'
          import json
          from pathlib import Path
          d=json.loads(Path('data/daily.json').read_text(encoding='utf-8'))
          events=[e for tier in d.get('tiers',{}).values() for c in tier.values() for e in c.get('events',[]) if e.get('published_at')]
          if not events: raise SystemExit('QUALITY GATE FAILED: no events')
          cfg=json.loads(Path('config/country_tiers.json').read_text(encoding='utf-8'))
          coverage=[]
          for tier_name,countries in cfg['tiers'].items():
              for c in countries:
                  if not any(e.get('event_country')==c['name'] for e in events): coverage.append(f"{tier_name}:{c['name']}")
          if coverage: raise SystemExit('COUNTRY COVERAGE GATE FAILED: zero-event countries: '+', '.join(coverage))
          print('QUALITY GATE PASSED; events:',len(events))
          PY2
      - name: Commit daily snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json data/history/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "data: update daily radar"
            git restore scripts/build_daily.py
            git fetch origin main
            GIT_EDITOR=true git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
