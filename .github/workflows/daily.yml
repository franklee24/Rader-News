name: 雷达新闻每日更新

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build daily news
        run: python scripts/build_daily.py

      - name: Commit daily snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json
          git diff --cached --quiet || git commit -m "data: update daily radar"
          git push
