name: 雷达新闻每日更新

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_daily.py'
      - 'scripts/score_importance.py'
      - 'scripts/translate_titles.py'
      - '.github/workflows/daily.yml'
  workflow_dispatch:
# 北京时间 06:07、17:07（GitHub Actions cron 使用 UTC）
  schedule:
    - cron: '7 9,22 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-production
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Use checked-in news-source configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('scripts/build_daily.py').read_text(encoding='utf-8')
          if 'multi-source-event-first-direct-rss' not in text:
              raise SystemExit('SOURCE CONFIGURATION CHECK FAILED')
          if '中文优先' in text or 'en_cap=max(2' in text:
              raise SystemExit('LEGACY CHINESE-FIRST LOGIC DETECTED')
          if 'Coverage-India' in text or 'Coverage-United States' in text:
              raise SystemExit('LEGACY COUNTRY COVERAGE FEEDS DETECTED')
          if 'AI_FEEDS' not in text or "report['ai_news']=ai_events[:20]" not in text:
              raise SystemExit('AI/LLM NEWS CONFIGURATION MISSING')
          print('Checked-in V22 source configuration and AI/LLM module are active.')
          PY
      - name: Build daily news
        run: python scripts/build_daily.py
      - name: Apply V20 importance scoring
        run: python scripts/score_importance.py
      - name: Remove repeats and undated events
        run: |
          python - <<'PY'
          import json,re
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          BJ=timezone(timedelta(hours=8)); UTC=timezone.utc; root=Path('.')
          daily=root/'data/daily.json'; d=json.loads(daily.read_text(encoding='utf-8'))
          now=datetime.now(UTC).astimezone(BJ); anchor=now.replace(hour=8,minute=0,second=0,microsecond=0)
          if now<anchor: anchor-=timedelta(days=1)
          prev_date=(anchor.date()-timedelta(days=1)).isoformat(); pp=root/'data/history'/f'{prev_date}.json'
          prev=json.loads(pp.read_text(encoding='utf-8')) if pp.exists() else {}
          ids=set(); urls=set(); titles=set(); norm=lambda s: re.sub(r'[^0-9a-z\u4e00-\u9fff]+',' ',(s or '').lower()).strip()
          def add(e):
              if e.get('id'): ids.add(e['id'])
              if e.get('url'): urls.add(e['url'])
              if e.get('source_url'): urls.add(e['source_url'])
              if e.get('title'): titles.add(norm(e['title']))
          for tier in prev.get('tiers',{}).values():
              for c in tier.values():
                  for e in c.get('events',[]): add(e)
          for e in prev.get('supplement',[]): add(e)
          removed=0; undated=0
          for tier in d.get('tiers',{}).values():
              for c in tier.values():
                  keep=[]
                  for e in c.get('events',[]):
                      if not e.get('published_at'): undated+=1; continue
                      if e.get('id') in ids or e.get('url') in urls or norm(e.get('title')) in titles: removed+=1
                      else: keep.append(e)
                  limit=int(c.get('target_max') or len(keep))
              c['events']=keep[:limit]; c['count']=len(c['events'])
          # Rebuild GLOBAL TOP from the final post-deduplication country lists.
          current=[e for tier in d.get('tiers',{}).values() for c in tier.values() for e in c.get('events',[])]
          current.extend(d.get('supplement',[]))
          unique=[]; seen=set()
          for e in sorted(current,key=lambda x:(x.get('importance',0),x.get('published_at') or ''),reverse=True):
              key=e.get('id') or norm(e.get('title'))
              if not key or key in seen: continue
              seen.add(key); unique.append(e)
          d['global_top']=unique[:20]
          d['stats']['events']=sum(c.get('count',0) for t in d.get('tiers',{}).values() for c in t.values())
          d['stats']['tier1_events']=sum(c.get('count',0) for c in d.get('tiers',{}).get('tier1',{}).values())
          d['stats']['supplement_events']=len(d.get('supplement',[]))
          d['dedupe_previous_edition']={'previous_date':prev_date,'removed':removed,'undated_removed':undated,'buffered_candidates_used':True}
          daily.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'data/history'/f'{anchor.date().isoformat()}.json').write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Removed repeats:',removed,'undated:',undated)
          PY
      - name: Translate English titles only
        run: python scripts/translate_titles.py
      - name: Validate event quality
        run: |
          python - <<'PY2'
          import json
          from pathlib import Path
          d=json.loads(Path('data/daily.json').read_text(encoding='utf-8'))
          events=[e for tier in d.get('tiers',{}).values() for c in tier.values() for e in c.get('events',[]) if e.get('published_at')]
          if len(events)<40: raise SystemExit('QUALITY GATE FAILED: too few events')
          if not any((e.get('source_authority') or 0)>=85 for e in events):
              raise SystemExit('QUALITY GATE FAILED: no high-authority international source represented')
          print('QUALITY GATE PASSED; events:',len(events),'high-authority:',sum(1 for e in events if (e.get('source_authority') or 0)>=85))
          PY2
      - name: Commit daily snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json data/history/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "data: update daily radar"
            git restore scripts/build_daily.py
            git fetch origin main
            GIT_EDITOR=true git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
