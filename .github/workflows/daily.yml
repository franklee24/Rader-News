name: 雷达新闻每日更新

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC: Beijing 08:00 = UTC 00:00
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-production
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build daily news
        run: python scripts/build_daily.py

      - name: Validate fixed Beijing window and quality
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          BJ=timezone(timedelta(hours=8))
          UTC=timezone.utc
          p=Path('data/daily.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          now=datetime.now(UTC).astimezone(BJ)
          anchor=now.replace(hour=8,minute=0,second=0,microsecond=0)
          if now < anchor:
              anchor-=timedelta(days=1)
          start=anchor-timedelta(days=1)
          end=anchor

          if d.get('window_start') != start.astimezone(UTC).isoformat():
              raise SystemExit(f"QUALITY GATE FAILED: wrong window_start={d.get('window_start')} expected={start.astimezone(UTC).isoformat()}")
          if d.get('window_end') != end.astimezone(UTC).isoformat():
              raise SystemExit(f"QUALITY GATE FAILED: wrong window_end={d.get('window_end')} expected={end.astimezone(UTC).isoformat()}")

          events=d.get('events',[])
          if not events:
              raise SystemExit('QUALITY GATE FAILED: no events')

          stale=[]
          for e in events:
              ts=e.get('published_at')
              if not ts:
                  stale.append(e.get('title','(untitled)'))
                  continue
              try: t=datetime.fromisoformat(ts.replace('Z','+00:00')).astimezone(UTC)
              except Exception: stale.append(e.get('title','(bad timestamp)')); continue
              if t < start.astimezone(UTC) or t >= end.astimezone(UTC):
                  stale.append(e.get('title','(untitled)'))
          if stale:
              raise SystemExit(f'QUALITY GATE FAILED: {len(stale)} events outside fixed window')

          cfg=json.loads(Path('config.json').read_text(encoding='utf-8'))
          tier1=cfg['tiers']['Tier 1']
          counts=d.get('quality',{}).get('country_event_counts',{})
          diversity=d.get('quality',{}).get('country_source_diversity',{})
          # 20 is the requested floor; fewer is acceptable only when the source pool genuinely has fewer events.
          # Hard-fail only on zero data or zero source diversity; do not manufacture stories to reach 20.
          for c in tier1:
              if counts.get(c,0) < 1:
                  raise SystemExit(f'QUALITY GATE FAILED: Tier 1 country has zero events: {c}')
              if diversity.get(c,0) < 3:
                  raise SystemExit(f'QUALITY GATE FAILED: Tier 1 country has fewer than 3 independent source domains: {c} ({diversity.get(c,0)})')

          print('QUALITY GATE PASSED')
          print('Window:', start.astimezone(BJ), '->', end.astimezone(BJ))
          print('Events:', len(events))
          print('Tier1:', {c: counts.get(c,0) for c in tier1})
          print('Tier1 source diversity:', {c: diversity.get(c,0) for c in tier1})
          PY

      - name: Commit daily snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json
          git diff --cached --quiet || git commit -m "data: update daily radar"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
