name: 雷达新闻每日更新

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC: Beijing 08:00 = UTC 00:00
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-production
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Lock builder to the fixed Beijing 08:00 window
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_daily.py')
          text=p.read_text(encoding='utf-8')
          old='now=dt.datetime.now(dt.timezone.utc); cutoff=now-dt.timedelta(hours=25)'
          new="now=dt.datetime.now(dt.timezone.utc); bj=dt.datetime.now(dt.timezone(dt.timedelta(hours=8))); anchor=bj.replace(hour=8,minute=0,second=0,microsecond=0); anchor=anchor-dt.timedelta(days=1) if bj < anchor else anchor; cutoff=anchor.astimezone(dt.timezone.utc)-dt.timedelta(days=1)"
          if old not in text: raise SystemExit('WINDOW PATCH FAILED')
          p.write_text(text.replace(old,new),encoding='utf-8')
          PY
      - name: Build daily news
        run: python scripts/build_daily.py
      - name: Validate fixed window and quality
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          BJ=timezone(timedelta(hours=8)); UTC=timezone.utc
          d=json.loads(Path('data/daily.json').read_text(encoding='utf-8'))
          now=datetime.now(UTC).astimezone(BJ); anchor=now.replace(hour=8,minute=0,second=0,microsecond=0)
          if now < anchor: anchor-=timedelta(days=1)
          start=anchor-timedelta(days=1); end=anchor; su=start.astimezone(UTC); eu=end.astimezone(UTC)
          events=d.get('events',[])
          if not events: raise SystemExit('QUALITY GATE FAILED: no events')
          bad=[]
          for e in events:
              ts=e.get('published_at')
              try: t=datetime.fromisoformat(ts.replace('Z','+00:00')).astimezone(UTC)
              except Exception: bad.append(e.get('title','')); continue
              if t<su or t>=eu: bad.append(e.get('title',''))
          if bad: raise SystemExit(f'QUALITY GATE FAILED: {len(bad)} outside fixed window')
          cfg=json.loads(Path('config.json').read_text(encoding='utf-8')); tier1=cfg['tiers']['Tier 1']
          counts={c:0 for c in tier1}; src={c:set() for c in tier1}
          for e in events:
              c=e.get('event_country')
              if c in counts:
                  counts[c]+=1
                  src[c].update((s.get('name') or '').strip() for s in e.get('sources',[]) if s.get('name'))
          for c in tier1:
              if counts[c]<1: raise SystemExit(f'QUALITY GATE FAILED: zero events {c}')
              if len(src[c])<3: raise SystemExit(f'QUALITY GATE FAILED: fewer than 3 sources {c}: {len(src[c])}')
          print('QUALITY GATE PASSED',start,end); print(counts); print({c:len(src[c]) for c in tier1})
          PY
      - name: Commit daily snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json
          git diff --cached --quiet || git commit -m "data: update daily radar"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
