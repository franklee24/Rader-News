name: 临时修复雷达24小时校验

on:
  push:
    paths:
      - .github/workflows/fix-daily-validation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Replace fixed 08:00 validation with rolling 24h validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('.github/workflows/daily.yml')
          text=p.read_text(encoding='utf-8')
          pattern=r"      - name: Validate fixed window and country coverage\n        run: \|\n(?:.*?)(?=      - name: Commit daily snapshot)"
          replacement='''      - name: Validate rolling 24h window and country coverage\n        run: |\n          python - <<'PY2'\n          import json\n          from datetime import datetime,timezone,timedelta\n          from pathlib import Path\n          UTC=timezone.utc; d=json.loads(Path('data/daily.json').read_text(encoding='utf-8'))\n          now=datetime.now(UTC); start=now-timedelta(hours=24); end=now+timedelta(minutes=5)\n          events=[e for tier in d.get('tiers',{}).values() for c in tier.values() for e in c.get('events',[])]\n          if not events: raise SystemExit('QUALITY GATE FAILED: no events')\n          for e in events:\n              t=datetime.fromisoformat(e['published_at'].replace('Z','+00:00')).astimezone(UTC)\n              if t<start or t>=end: raise SystemExit('QUALITY GATE FAILED: event outside rolling 24h window: '+e.get('title',''))\n          cfg=json.loads(Path('config/country_tiers.json').read_text(encoding='utf-8'))\n          coverage=[]\n          for tier_name,countries in cfg['tiers'].items():\n              for c in countries:\n                  ev=[e for e in events if e.get('event_country')==c['name']]\n                  if len(ev)==0: coverage.append(f"{tier_name}:{c['name']}")\n          if coverage: raise SystemExit('COUNTRY COVERAGE GATE FAILED: zero-event countries: '+', '.join(coverage))\n          print('QUALITY GATE PASSED rolling 24h',start,end)\n          PY2\n'''
          new,n=re.subn(pattern,replacement,text,flags=re.S)
          if n!=1: raise SystemExit(f'VALIDATION BLOCK REPLACE FAILED: {n}')
          p.write_text(new,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/daily.yml
          git commit -m "fix: use rolling 24h validation for radar" || exit 0
          git push origin HEAD:main