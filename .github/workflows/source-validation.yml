name: Validate AI news sources
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_daily.py'
      - 'scripts/score_importance.py'
      - '.github/workflows/source-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-ai-feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Syntax and editorial rules
        run: |
          python -m py_compile scripts/build_daily.py scripts/score_importance.py scripts/translate_titles.py
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('build_daily','scripts/build_daily.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          assert m.is_ai_related({'title':'OpenAI releases a new reasoning model'})
          assert m.is_ai_related({'title':'Google DeepMind announces AI research'})
          assert not m.is_ai_related({'title':'Central bank raises interest rates'})
          assert m.category('OpenAI launches a new large language model')=='AI/LLM'
          print('AI classification tests passed; AI feeds:',len(m.AI_FEEDS))
          PY
      - name: Probe AI RSS feeds
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('build_daily','scripts/build_daily.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          ok=[]; bad=[]
          for feed in m.AI_FEEDS:
              name, country, url, lang=feed
              body,err=m.fetch(url)
              if body:
                  try:
                      rows=m.parse_feed(body,name,country,lang)
                      if rows:
                          ok.append((name,len(rows)))
                          print('PASS',name,'items=',len(rows))
                      else:
                          bad.append((name,'empty feed'))
                          print('WARN',name,'empty feed')
                  except Exception as e:
                      bad.append((name,'parse '+str(e)[:100]))
                      print('WARN',name,'parse failed',str(e)[:100])
              else:
                  bad.append((name,err))
                  print('WARN',name,err)
          print('AI FEED RESULT',len(ok),'passed,',len(bad),'unavailable/empty')
          if len(ok)<6:
              raise SystemExit('Too few AI feeds are usable; at least 6 must pass')
          if sum(1 for name,_ in ok if name in {'OpenAI News','Google AI Blog','Google DeepMind','Anthropic News Watch','NVIDIA AI Blog','Microsoft AI Blog','Hugging Face Blog','Apple ML Research','AWS ML Blog','Microsoft Research AI','Google Research'})<2:
              raise SystemExit('Too few first-party AI company feeds are usable')
          PY

      - name: Build sample daily dataset and verify 20 AI stories
        run: |
          python scripts/build_daily.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/daily.json').read_text(encoding='utf-8'))
          print('AI stories:',d.get('ai_news_count'),'target:',d.get('ai_news_target'))
          print('Country events before previous-edition dedupe:',d.get('stats',{}).get('events'))
          if d.get('ai_news_count') != 20:
              raise SystemExit('AI/LLM module did not reach its 20-story daily target')
          if d.get('stats',{}).get('events',0) < 40:
              raise SystemExit('Country news coverage below minimum threshold')
          PY
