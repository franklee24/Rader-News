name: Apply bilingual title order fix v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'English title primary') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch bilingual title rendering
        shell: python
        run: |
          import re
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # English must remain the primary headline; Chinese translation follows beneath it.
          s=s.replace('e.title_zh||e.title', 'e.title||e.title_zh')
          # Replace the existing headline expression wherever the V8 renderer stores it.
          pat=r'<h[34]>\$\{esc\(e\.title\|\|e\.title_zh\)\}</h[34]>'
          repl='<h4>${esc(e.title||e.title_zh)}</h4>${e.title_zh&&e.title&&e.title_zh!==e.title?`<div class="original-title">译文：${esc(e.title_zh)}</div>`:""}'
          s,n=re.subn(pat,repl,s,count=1)
          if n!=1:
              # If the current renderer uses a slightly different title expression, patch the first event headline conservatively.
              pat2=r'<h[34]>\$\{esc\(e\.title[^}]*\)\}</h[34]>'
              s,n=re.subn(pat2,repl,s,count=1)
          if n!=1:
              raise SystemExit(f'headline replace count={n}')
          # Search should include both English and Chinese titles.
          s=re.sub(r'\[e\.title,e\.event_country', '[e.title,e.title_zh,e.event_country', s, count=1)
          # Detail view: English primary, Chinese translation underneath.
          detail=repl
          s=re.sub(r'<h2>\$\{esc\(e\.title\|\|e\.title_zh\)\}</h2>', '<h2>${esc(e.title||e.title_zh)}</h2>${e.title_zh&&e.title&&e.title_zh!==e.title?`<div class="original-title">译文：${esc(e.title_zh)}</div>`:""}', s, count=1)
          p.write_text(s,encoding='utf-8')
          print('bilingual title order patched')
      - name: Verify source
        run: |
          grep -q '译文：' index.html
          grep -q 'e.title||e.title_zh' index.html
          echo 'SOURCE_VERIFY_OK'
      - name: Commit and remove one-off workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-bilingual-order.yml .github/workflows/fix-bilingual-order-run.yml .github/workflows/fix-bilingual-order-run2.yml || true
          git diff --cached --quiet && exit 0
          git commit -m "fix: English title primary, Chinese translation secondary"
          git push
