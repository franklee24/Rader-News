name: 雷达新闻每日调度守护

# UTC cron is intentional: it avoids timezone-parser ambiguity. The watchdog
# is only a health check around 08:00 Beijing; production has its own schedule.
on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 0 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: radar-scheduler-watchdog
  cancel-in-progress: false

jobs:
  schedule-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify production workflow is present
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/daily.yml').read_text(encoding='utf-8')
          if 'schedule:' not in text:
              raise SystemExit('Production schedule missing')
          print('Production schedule exists.')
          PY
