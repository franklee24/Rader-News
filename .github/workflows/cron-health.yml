name: 雷达新闻每日调度守护

# This watchdog validates the production scheduler chain. Production runs are
# dispatched by reliable-scheduler.yml, not by a cron expression in daily.yml.
on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 0 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: radar-scheduler-watchdog
  cancel-in-progress: false

jobs:
  schedule-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify production scheduler chain is present
        run: |
          python - <<'PY'
          from pathlib import Path
          daily=Path('.github/workflows/daily.yml').read_text(encoding='utf-8')
          scheduler=Path('.github/workflows/reliable-scheduler.yml').read_text(encoding='utf-8')
          if 'workflow_dispatch:' not in daily:
              raise SystemExit('Production workflow cannot be dispatched')
          if 'checkpoints=(0 240 360 480 720 750 780 840 870 900 960 1020 1066 1200)' not in scheduler:
              raise SystemExit('Expected Beijing scheduler checkpoints missing')
          if 'gh workflow run daily.yml --repo franklee24/Rader-News --ref main' not in scheduler:
              raise SystemExit('Scheduler no longer dispatches the production workflow')
          print('Production workflow dispatch and Beijing scheduler checkpoints verified.')
          PY
